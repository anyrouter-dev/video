name: youtube

# Uploads the films of a GitHub Release that are not on YouTube yet: after the
# render-video upload failed (an expired token), or after a regen added a
# rendition (regen never uploads). It renders nothing: it fetches each film the
# ledger row has no YouTube link for, runs `publish`, which uploads those and
# skips the rest, and fails unless every rendition then has its link.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'The film kind'
        type: choice
        options: [explainer, openrouter-unblock, sign-in-with-anyrouter, pool-donation, teaser, intro, model-drop, release, changelog]
      id:
        description: 'The release id from releases/<kind>/index.json, e.g. 001-20261018-v1-1cbd1f149e'
        required: true

# Shares the render-video group: both commit the ledger to main.
concurrency:
  group: render-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      KIND: ${{ inputs.kind }}
      ID: ${{ inputs.id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The asset names come from lib/publish.mjs, the code that attached them.
      - name: Fetch the films that are not on YouTube yet
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { find } from "./lib/ledger.mjs";
            import { releaseFiles } from "./lib/publish.mjs";
            import { loadKind } from "./lib/kinds.mjs";
            const e = find(process.env.KIND, process.env.ID);
            if (!e) { console.error(`no ${process.env.KIND} release "${process.env.ID}"`); process.exit(1); }
            for (const f of releaseFiles(await loadKind(process.env.KIND), e)) if (!f.youtube) console.log(f.name, f.artifact);
          ' > want.txt
          cat want.txt
          while read -r name dest; do
            mkdir -p "$(dirname "$dest")"
            gh release download "$KIND-$ID" -p "$name" -O "$dest"
          done < want.txt

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_TITLE_TEMPLATE: ${{ vars.YT_TITLE_TEMPLATE }}
        run: |
          set -euo pipefail
          node lib/cli.mjs publish "$KIND" "$ID" | tee publish.log
          grep '── youtube: uploaded' publish.log >> "$GITHUB_STEP_SUMMARY" || true
          # publish records each link on its film the moment the upload lands.
          node --input-type=module -e '
            import { find } from "./lib/ledger.mjs";
            const e = find(process.env.KIND, process.env.ID);
            const left = Object.entries(e.renditions).filter(([, f]) => !f.youtube).map(([r]) => r);
            if (left.length) { console.log(`::error::not on YouTube: ${left.join(", ")}`); process.exit(1); }
          '

      - name: Commit the ledger
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases
          if git diff --cached --quiet; then echo 'nothing to record'; exit 0; fi
          git commit -m "chore(video): record the youtube upload of $KIND $ID"
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo '::error::could not push the ledger'; exit 1
