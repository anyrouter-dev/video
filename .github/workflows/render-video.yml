name: render-video

# One job. It asks each kind "is there anything unreleased?" using nothing but
# Node, and stops there on a quiet night — no npm ci, no Chrome, no ffmpeg.
# When there is something, an agent may pick the story, then it renders,
# publishes to a GitHub Release, and records the ledger and baselines in ONE
# commit. Two jobs pushing to main from one checkout is a race; keep it one job.
#
# `regen` re-renders releases that are already out, from their frozen facts, and
# replaces the assets of their GitHub Releases in place.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which film — auto = every nightly kind that has something new'
        type: choice
        default: auto
        options: [auto, model-drop, release, changelog, intro]
      force:
        description: 'Render even if this release is already in the ledger'
        type: boolean
        default: false
      limit:
        description: 'Cap the item count / force a layout (blank = let the kind decide)'
        required: false
        default: ''
      seconds:
        description: 'Film length in seconds (blank = the kind default)'
        required: false
        default: ''
      regen:
        description: 'Re-render released films of this kind instead: a release id, or "all" (needs a kind)'
        required: false
        default: ''
  # the AnyRouter repo dispatches this after a model or a release ships
  repository_dispatch:
    types: [model-added, release-published]
  # catch anything new even if nobody dispatched
  schedule:
    - cron: '17 7 * * *'

# Never cancel a run that may be halfway through publishing; queue instead.
concurrency:
  group: render-video
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    name: film
    runs-on: ubuntu-latest
    # A regen of every release of a kind is several renders back to back.
    timeout-minutes: 45
    # Creates the GitHub Release and commits the ledger.
    permissions:
      contents: write
    env:
      KIND: ${{ inputs.kind || 'auto' }}
      REGEN: ${{ inputs.regen }}
      # Releases and ledger commits only ever come from main. A run on a branch
      # renders and uploads a workflow artifact, nothing else.
      SHIP: ${{ github.ref == 'refs/heads/main' }}
      # A step cannot read its own `env` in its `if`, so the guard lives here.
      HAS_AGENT: ${{ secrets.OPENCODE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. decide — Node builtins only, a few seconds ────────────────────
      - name: What is unreleased?
        id: decide
        run: |
          set -euo pipefail
          if [ -n "$REGEN" ]; then
            [ "$KIND" != "auto" ] || { echo '::error::regen needs a kind'; exit 1; }
            node lib/cli.mjs ledger "$KIND" | tee decide.log
            echo "kinds=$KIND" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = "auto" ]; then
            node lib/cli.mjs pending | tee decide.log
          elif [ "${{ inputs.force }}" = "true" ]; then
            node lib/cli.mjs collect "$KIND" | tee decide.log
            echo "kinds=$KIND" >> "$GITHUB_OUTPUT"
          else
            node lib/cli.mjs pending "$KIND" | tee decide.log
          fi
          { echo '### What is unreleased'; echo '```'; cat decide.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ── 2. tools — only when there is something to render ────────────────
      - name: Cache node_modules and the render browser
        if: steps.decide.outputs.kinds != ''
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/hyperframes
            ~/.cache/ffmpeg
          key: render-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install
        if: steps.decide.outputs.kinds != '' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # A static ffmpeg kept in the cache: apt-get was slow and sometimes hung.
      - name: ffmpeg and the render browser
        if: steps.decide.outputs.kinds != ''
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ ! -x ~/.cache/ffmpeg/ffmpeg ]; then
            mkdir -p ~/.cache/ffmpeg
            curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              | tar -xJ --strip-components=2 -C ~/.cache/ffmpeg --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$HOME/.cache/ffmpeg" >> "$GITHUB_PATH"
          ~/.cache/ffmpeg/ffmpeg -version | head -1
          npx hyperframes browser ensure

      # ── 3. judgment — optional. A missing key, a rate limit or an agent
      #    outage cannot fail the build: the film renders with its defaults, and
      #    the CLI drops any part of a plan that breaks ci/AGENT.md.
      #    Bump the key suffix to pick up a newer opencode.
      - name: Cache opencode
        if: steps.decide.outputs.kinds != '' && env.REGEN == '' && env.HAS_AGENT == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.opencode
          key: opencode-${{ runner.os }}-v1

      - name: Let the agent pick the story
        if: steps.decide.outputs.kinds != '' && env.REGEN == '' && env.HAS_AGENT == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          KINDS: ${{ steps.decide.outputs.kinds }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -uo pipefail
          [ -x ~/.opencode/bin/opencode ] || curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          for K in $KINDS; do
            PROMPT="ci/prompts/plan-$K.md"
            [ -f "$PROMPT" ] || continue
            # The prompt, then the brief: the facts path, the item ids it may
            # pick, the schema. `--auto` because a prompt waiting on a TTY stalls the job.
            timeout 240 opencode run --auto --format json "$(cat "$PROMPT"; echo; node lib/cli.mjs plan "$K")" > "agent-$K.json" \
              || echo "::warning::opencode did not finish $K — rendering the default film"
            if [ -s ".build/$K/plan.json" ]; then
              { echo "### Agent plan — $K"; echo '```json'; cat ".build/$K/plan.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # ── 4. render → publish → accept, one kind at a time ─────────────────
      - name: Render and release
        if: steps.decide.outputs.kinds != ''
        env:
          KINDS: ${{ steps.decide.outputs.kinds }}
          FORCE: ${{ inputs.force }}
          LIMIT: ${{ inputs.limit }}
          SECONDS_: ${{ inputs.seconds }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          YT_TITLE_TEMPLATE: ${{ vars.YT_TITLE_TEMPLATE }}
        run: |
          set -uo pipefail
          ARGS=""
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit=$LIMIT"
          [ -n "$SECONDS_" ] && ARGS="$ARGS --seconds=$SECONDS_"
          if [ -n "$REGEN" ]; then
            [ "$REGEN" = "all" ] && ARGS="$ARGS --all" || ARGS="$REGEN $ARGS"
            [ "$SHIP" = "true" ] && ARGS="$ARGS --publish"
            CMD=regen
          else
            # --reuse: film exactly the facts the decide step (and the agent) saw.
            ARGS="$ARGS --reuse"
            [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
            [ "$SHIP" = "true" ] && ARGS="$ARGS --publish --accept"
            CMD=run
          fi
          FAILED=""
          for K in $KINDS; do
            echo "::group::$K"
            # One kind failing must not stop the others from shipping.
            if node lib/cli.mjs $CMD "$K" $ARGS 2>&1 | tee "run-$K.log"; then STATE=ok; else STATE=FAILED; FAILED="$FAILED $K"; fi
            echo "::endgroup::"
            { echo "### $CMD $K — $STATE"; echo '```'; tail -40 "run-$K.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -n "$FAILED" ]; then echo "::error::failed:$FAILED"; exit 1; fi

      # ── 5. record — one commit, even when a kind above failed, so whatever
      #    did ship is never rendered twice.
      - name: Commit the ledger and the baselines
        if: always() && env.SHIP == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add releases videos/*/baseline.json
          if git diff --cached --quiet; then echo 'nothing to record'; exit 0; fi
          git commit -m "chore(video): ${REGEN:+regen }record ${{ steps.decide.outputs.kinds || 'baseline' }}"
          # Someone may have pushed while this rendered: rebase and retry.
          for i in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo '::error::could not push the ledger'; exit 1

      # The GitHub Release is the store. This copy is for branch runs, which do
      # not publish, and for debugging a run that failed.
      - name: Keep the renders
        if: always() && steps.decide.outputs.kinds != '' && (env.SHIP != 'true' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: |
            renders/
            agent-*.json
          if-no-files-found: ignore
          retention-days: 7
