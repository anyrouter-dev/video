<!doctype html>
<!-- A two-second film for the dual-render tests: one card, a landscape layout and a portrait one. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F7F4EC; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F7F4EC; }
      .card {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4%;
        font-family: sans-serif; color: #0A0A0A;
      }
      .mark { width: 22%; aspect-ratio: 1; background: #0A0A0A; }
      .words h1 { font-size: 120px; line-height: 1; letter-spacing: -2px; }
      .words p { font-size: 48px; margin-top: 24px; color: #3A3A3A; }
      @media (orientation: portrait) {
        .card { flex-direction: column; justify-content: flex-start; padding-top: 30%; gap: 6%; text-align: center; }
        .mark { width: 50%; }
        .words h1 { font-size: 132px; }
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1920" data-height="1080">
      <div class="card">
        <div class="mark"></div>
        <div class="words">
          <h1>AnyRouter</h1>
          <p>One key, every model.</p>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from('#root .mark', { scale: 0.6, duration: 0.6, ease: 'power3.out' }, 0);
      tl.from('#root .words', { y: 40, duration: 0.6, ease: 'power3.out' }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
