    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);

    align-items: center;

    letter-spacing: -0.02em;
    text-align: center;
    text-wrap: balance;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* portrait rendition: the 900px safe width holds a short phrase on one line, a long one on two */
  @media (orientation: portrait) {
    .caption-stage {

      right: 120px;
