    inset: 0;
    pointer-events: none;

  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-chip {
    max-width: 1640px;
    color: #0A0A0A;
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    font-size: 52px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    text-align: center;
    text-wrap: balance;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* portrait rendition: the 900px safe width holds a short phrase on one line, a long one on two */
  @media (orientation: portrait) {
    .caption-stage {
      left: 60px;
      right: 120px;
    }
    .caption-chip {
      max-width: 900px;
      font-size: 46px;
    }
  }
