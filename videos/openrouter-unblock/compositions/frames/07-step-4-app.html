  <script>
    (function () {
      const $ = (id) => document.getElementById("07-step-4-app-" + id);
      const tl = gsap.timeline({ paused: true });

      // Word starts (frame-local seconds) from 07-step-4-app.words.json
      const OLD_LINES = 0.3; // with the card, so the terminal is never empty
      const ANYROUTER_KEY = 2.26;
      const KEY = 2.86;
      const BASE = 4.29;
      const OPENROUTER_FREE = 6.15;
      const LAST_WORD_DONE = 7.0;

      // Hidden states held from t=0
      tl.set([$("c4-on"), $("l4-on"), $("c4-done"), $("l4-done")], { opacity: 0 }, 0);
      tl.set([$("new1"), $("new2"), $("new3"), $("note1"), $("note3"), $("under")], { opacity: 0 }, 0);
      tl.set([$("old1"), $("old2"), $("old3")], { opacity: 0 }, 0);

      // Rail: step 4 active
      tl.fromTo($("c4-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c4-todo"), { opacity: 0 }, 0.55);
      tl.to($("l4-on"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);

      // Scene 1: the .env card rises; old OpenRouter values appear on "In your app"
      tl.fromTo($("term"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
      [1, 2, 3].forEach((n, i) => {
        tl.fromTo($("old" + n), { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, OLD_LINES + i * 0.08);
      });

      // Swap in place: old text is fully gone before the new text starts, so they never overlap
      const swap = (n, t) => {
        tl.to($("old" + n), { opacity: 0, duration: 0.1, ease: "power2.in" }, t);
        tl.fromTo($("new" + n), { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t + 0.1);
        tl.fromTo($("ok" + n), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", transformOrigin: "50% 50%" }, t + 0.3);
      };

      // Line 1 on the first "AnyRouter" (of "AnyRouter key"), note and the separate-key line follow
      swap(1, ANYROUTER_KEY);
      tl.fromTo($("note1"), { y: -6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, ANYROUTER_KEY + 0.4);
      tl.fromTo($("under"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, KEY);

      // Line 2 on "Base"
      swap(2, BASE);

      // Line 3 on "openrouter/free", then its BYOK note
      swap(3, OPENROUTER_FREE);
      tl.fromTo($("note3"), { y: -6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, OPENROUTER_FREE + 0.45);

      // Rail: step 4 done inside the last word, then hold
      tl.fromTo($("c4-done"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, LAST_WORD_DONE);
      tl.to($("l4-done"), { opacity: 1, duration: 0.3, ease: "power2.out" }, LAST_WORD_DONE);
      tl.set($("c4-on"), { opacity: 0 }, LAST_WORD_DONE + 0.35);
      tl.set($("l4-on"), { opacity: 0 }, LAST_WORD_DONE + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-step-4-app"] = tl;
    })();
  </script>
