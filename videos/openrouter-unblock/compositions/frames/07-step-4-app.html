      };

      // Hidden states held from t=0
      gsap.set($("cursor"), { transformOrigin: "2px 2px" });
      tl.set([$("c4-on"), $("l4-on"), $("c4-done"), $("l4-done")], { opacity: 0 }, 0);
      tl.set([$("new1"), $("new2"), $("new3"), $("note1"), $("note2"), $("note3"), $("under")], { opacity: 0 }, 0);
      tl.set([$("old1"), $("old2"), $("old3"), $("term"), $("eyebrow")], { opacity: 0 }, 0);
      tl.set([$("card"), $("made"), $("copy-done"), $("ripple-create"), $("ripple-submit"), $("ripple-copy")], { opacity: 0 }, 0);
      tl.set($("ul"), { scaleX: 0 }, 0);

      // Rail: step 4 active
      tl.fromTo($("c4-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c4-todo"), { opacity: 0 }, 0.55);
      tl.to($("l4-on"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);

      // Scene 1: AnyRouter's API Keys page; "API Keys" underlines; Create key on "create"
      tl.fromTo($("browser"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo($("cursor"), { ...at(START), opacity: 0 }, { ...at(START), opacity: 1, duration: 0.25, ease: "power2.out" }, 0.6);
      tl.to($("ul"), { scaleX: 1, duration: 0.45, ease: "power3.out" }, API);
      tl.to($("cursor"), { ...at(CREATE_BTN), duration: 0.6, ease: "power2.inOut" }, CREATE - 0.65);
      click($("create"), "ripple-create", CREATE_BTN, CREATE);

      // Scene 2: name it, create it, copy the new sk-ar key (shown once)
      tl.fromTo($("card"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, CREATE + 0.12);
      tl.fromTo($("typed"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "steps(6)" }, CREATE + 0.3);
      tl.to($("cursor"), { ...at(SUBMIT), duration: 0.4, ease: "power2.inOut" }, CREATE + 0.35);
      click($("submit"), "ripple-submit", SUBMIT, APP - 0.15);
      tl.to($("form"), { opacity: 0, duration: 0.12, ease: "power2.in" }, APP - 0.05);
      tl.fromTo($("made"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, APP + 0.08);
      tl.fromTo($("code"), { backgroundColor: "#FFF4EC" }, { backgroundColor: "#F4F4F5", duration: 0.6, ease: "power2.out" }, APP + 0.08);
      tl.to($("cursor"), { ...at(COPY), duration: 0.35, ease: "power2.inOut" }, APP + 0.15);
      click($("copy"), "ripple-copy", COPY, APP + 0.55);
      tl.to($("copy-idle"), { opacity: 0, duration: 0.08, ease: "power2.out" }, APP + 0.58);
      tl.to($("copy-done"), { opacity: 1, duration: 0.12, ease: "power2.out" }, APP + 0.6);

      // Scene 3: on "Then" the page gives way to the app's .env; old OpenRouter values, dim
      tl.to([$("browser"), $("cursor")], { opacity: 0, duration: 0.25, ease: "power2.in" }, THEN - 0.1);
      tl.fromTo($("eyebrow"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, THEN + 0.2);
      tl.fromTo($("term"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, THEN + 0.15);
      [1, 2, 3].forEach((n, i) => {
        tl.fromTo($("old" + n), { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, THEN + 0.4 + i * 0.08);
      });

      // Swap in place: old text is fully gone before the new text starts, so they never overlap
      const swap = (n, t) => {
        tl.to($("old" + n), { opacity: 0, duration: 0.1, ease: "power2.in" }, t);
        tl.fromTo($("new" + n), { x: -8, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, t + 0.1);
        tl.fromTo($("ok" + n), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out", transformOrigin: "50% 50%" }, t + 0.3);
      };
      const noteIn = (id, t) => tl.fromTo($(id), { y: -6, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, t);

      swap(1, THAT_KEY);
      noteIn("note1", THAT_KEY + 0.4);
      swap(2, ADDRESS);
      noteIn("note2", ADDRESS + 0.4);

      // The model stays: same id, it lights on "Keep" and is checked
      swap(3, KEEP);
      tl.fromTo($("new3"), { scale: 1 }, { scale: 1.04, duration: 0.25, ease: "power2.out", transformOrigin: "0% 50%", immediateRender: false }, OPENROUTER_FREE);
      tl.to($("new3"), { scale: 1, duration: 0.3, ease: "power2.inOut" }, OPENROUTER_FREE + 0.25);
      tl.fromTo($("under"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ANYROUTER_NOW);
      noteIn("note3", RUNS);

      // Rail: step 4 done inside the last word, then hold
      tl.fromTo($("c4-done"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, LAST_WORD_DONE);
      tl.to($("l4-done"), { opacity: 1, duration: 0.3, ease: "power2.out" }, LAST_WORD_DONE);
      tl.set($("c4-on"), { opacity: 0 }, LAST_WORD_DONE + 0.35);
      tl.set($("l4-on"), { opacity: 0 }, LAST_WORD_DONE + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["07-step-4-app"] = tl;
    })();
  </script>
</template>
