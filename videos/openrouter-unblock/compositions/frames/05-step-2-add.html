                <span>OpenRouter</span>

              <div class="pfoot">
                <svg viewBox="0 0 22 22" fill="none" stroke="#636363" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="14" height="10" rx="2"/><path d="M7 10V7a4 4 0 0 1 8 0v3"/></svg>

            <div class="fhead" id="05-step-2-add-fhead">
              <svg class="or-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.654 3.87a5.087 5.087 0 110 10.174L23.7 19.09c.64.641.187 1.737-.72 1.737H8.48a8.479 8.479 0 010-16.958h10.175zM8.479 7.26a5.087 5.087 0 100 10.176 5.087 5.087 0 000-10.175z"/></svg>

              <div class="btn primary">Continue</div>

        <span>sk-or-v1-••••••••••••</span>
      </div>

      <div class="ripple" id="05-step-2-add-ripple-gh" style="left:704px;top:460px"></div>
      <div class="ripple" id="05-step-2-add-ripple-or" style="left:672.5px;top:507px"></div>
      <div class="ripple" id="05-step-2-add-ripple-test" style="left:1238.5px;top:789px"></div>
      <div class="ripple" id="05-step-2-add-ripple-add" style="left:1398.5px;top:789px"></div>

      <svg class="cursor" id="05-step-2-add-cursor" width="28" height="34" viewBox="0 0 28 34"><path d="M2 2 L2 27 L8.5 21 L13 31.5 L17.5 29.5 L13 19.5 L22 19.5 Z" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById("05-step-2-add-" + id);
      const tl = gsap.timeline({ paused: true });

      // Canvas points. Viewport origin is (385.5, 217.5); the action bar's buttons are fixed-width,
      // so Test key centres at abar x 591 and Add key at abar x 751, both at canvas y 817.
      const GITHUB = { x: 732, y: 488 };
      const CHIP_OR = { x: 700.5, y: 535 };
      const TEST = { x: 1266.5, y: 817 };
      const ADD = { x: 1426.5, y: 817 };
      const PILL_IN = { x: 756, y: 764 };        // centred at (960, 790)
      const PILL_PARK = { x: 1096, y: 774 };     // right of the sign-in dialog
      const PILL_FIELD = { x: 681.5, y: 514.5 }; // pill text start meets the input text start

      // Word starts from 05-step-2-add.words.json.
      const W_SIGN = 0.9, W_OPEN = 2.38, W_BYOK = 3.76, W_BRING = 4.77, W_PICK = 5.95, W_OPENROUTER = 6.01;
      const W_PASTE = 6.73, W_KEY = 7.08, W_TEST = 7.74, W_KEY2 = 8.02, W_ADD = 8.58;
      const T_VALID = W_KEY2 + 0.15;
      const at = (p) => ({ x: p.x - 2, y: p.y - 2 });

      gsap.set($("cursor"), { transformOrigin: "2px 2px", opacity: 0, x: 1060, y: 700 });
      gsap.set($("pill"), { x: PILL_IN.x, y: PILL_IN.y });
      gsap.set([$("val"), $("focus"), $("valid"), $("busy"), $("stext"), $("abar"), $("scrim"), $("dialog")], { opacity: 0 });

      const click = (target, ripple, t) => {
        tl.to($("cursor"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, t);
        tl.to($("cursor"), { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
        if (target) {
          tl.to(target, { scale: 0.96, duration: 0.06, ease: "power2.in" }, t);
          tl.to(target, { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
        }
        tl.fromTo(ripple, { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
      };

      // Rail: step 1 done, step 2 active at 0.2s
      tl.fromTo($("c1-done"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c1-active"), { opacity: 0 }, 0.55);
      tl.fromTo($("l1-on"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.2);
      tl.fromTo($("c2-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.28);
      tl.set($("c2-todo"), { opacity: 0 }, 0.63);
      tl.fromTo($("l2-on"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.28);

      // Scene 0: the real sign-in at anyrouter.dev is on screen from the first frame; the key parks right
      tl.fromTo($("sdlg"), { y: 12, scale: 0.985 }, { y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo($("pill"), { x: PILL_IN.x, y: PILL_IN.y }, { x: PILL_PARK.x, y: PILL_PARK.y, duration: 0.9, ease: "power2.inOut" }, 0.05);
      tl.fromTo($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.5);
      tl.to($("cursor"), { ...at(GITHUB), duration: 0.65, ease: "power2.inOut" }, W_SIGN + 0.1);
      click(null, $("ripple-gh"), W_SIGN + 0.8);
      tl.to($("cursor"), { x: 1238, y: 698, duration: 0.5, ease: "power2.inOut" }, W_SIGN + 1.05);

      // Scene 1: on "open" the browser becomes the BYOK dashboard; "BYOK" underlines; the callout lands on "bring"
      // Clean swap: the sign-in is fully gone (2.33) before any dashboard element shows (2.38).
      tl.to($("signin"), { opacity: 0, duration: 0.2, ease: "power2.in" }, W_OPEN - 0.25);
      tl.to($("url-home"), { opacity: 0, duration: 0.15, ease: "power2.in" }, W_OPEN - 0.2);
      tl.fromTo($("nav"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, W_OPEN);
      tl.fromTo($("url"), { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, W_OPEN + 0.1);
      tl.fromTo($("h1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W_OPEN);
      tl.fromTo($("panel"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, W_OPEN + 0.12);
      tl.fromTo([$("chip-or"), $("chip-nv")], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, W_OPEN + 0.3);
      tl.fromTo($("ul"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, W_BYOK);
      tl.fromTo($("callout"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, W_BRING);

      // Scene 2: cursor picks OpenRouter; the page swaps to the add-key form
      tl.to($("cursor"), { ...at(CHIP_OR), duration: 0.6, ease: "power2.inOut" }, W_PICK - 0.6);
      click($("chip-or"), $("ripple-or"), W_OPENROUTER);
      tl.fromTo($("pa"), { opacity: 1, y: 0 }, { opacity: 0, y: -8, duration: 0.2, ease: "power2.in", immediateRender: false }, W_OPENROUTER + 0.12);
      tl.fromTo($("pb"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, W_OPENROUTER + 0.3);
      tl.fromTo($("prail"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, W_OPENROUTER + 0.3);
      tl.fromTo([$("fhead"), $("base"), $("rule"), $("sect"), $("flabel"), $("input"), $("status")],
        { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.04 }, W_OPENROUTER + 0.32);
      tl.to($("cursor"), { x: 1178, y: 690, duration: 0.45, ease: "power2.inOut" }, W_OPENROUTER + 0.3);

      // Scene 3: on "paste" the parked key flies into the API key field and becomes its value
      tl.to($("pill"), { x: PILL_FIELD.x, y: PILL_FIELD.y, duration: 0.55, ease: "power2.inOut" }, W_PASTE);
      tl.to($("ph"), { opacity: 0, duration: 0.12, ease: "power2.out" }, W_PASTE + 0.15); // gone before the pill reaches the field
      tl.to($("pill"), { opacity: 0, duration: 0.15, ease: "power2.out" }, W_PASTE + 0.55);
      tl.fromTo($("val"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, W_PASTE + 0.55);
      tl.fromTo($("focus"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, W_PASTE + 0.5);
      tl.to($("focus"), { opacity: 0, duration: 0.25, ease: "power2.out" }, W_TEST);
      tl.fromTo($("abar"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, W_KEY);
      tl.fromTo($("add"), { opacity: 0.45 }, { opacity: 0.45, duration: 0.01 }, W_KEY);

      // Scene 4a: first click, on "test": Test key, then "Checking with OpenRouter…", then "Key valid"
      tl.to($("cursor"), { ...at(TEST), duration: 0.5, ease: "power2.inOut" }, W_TEST - 0.56);
      click($("test"), $("ripple-test"), W_TEST);
      tl.to([$("test"), $("cancel")], { opacity: 0, duration: 0.08, ease: "power2.out" }, W_TEST + 0.06);
      tl.fromTo($("busy"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out" }, W_TEST + 0.06);
      tl.fromTo($("spin"), { rotation: 0 }, { rotation: 300, duration: T_VALID - W_TEST - 0.06, ease: "none", transformOrigin: "50% 50%" }, W_TEST + 0.06);

      tl.to($("busy"), { opacity: 0, duration: 0.1, ease: "power2.out" }, T_VALID);
      tl.to([$("test"), $("cancel")], { opacity: 1, duration: 0.12, ease: "power2.out" }, T_VALID);
      tl.to($("untested"), { opacity: 0, duration: 0.12, ease: "power2.out" }, T_VALID);
      tl.fromTo($("valid"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, T_VALID);
      tl.fromTo($("stext"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, T_VALID + 0.04);
      tl.to($("add"), { opacity: 1, duration: 0.2, ease: "power2.out" }, T_VALID);

      // Scene 4b: second, separate move and click, on "add": Add key, then the result dialog
      tl.to($("cursor"), { ...at(ADD), duration: 0.3, ease: "power2.inOut" }, W_ADD - 0.34);
      click($("add"), $("ripple-add"), W_ADD);
      tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, W_ADD + 0.1);
      tl.fromTo($("dialog"), { opacity: 0, y: 28, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, W_ADD + 0.12);
      tl.to([$("rule"), $("sect"), $("flabel"), $("input"), $("status")], { opacity: 0, duration: 0.25, ease: "power2.out" }, W_ADD + 0.12);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-step-2-add"] = tl;
    })();
  </script>
