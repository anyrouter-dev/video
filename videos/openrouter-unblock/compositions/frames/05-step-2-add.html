    (function () {
      const $ = (id) => document.getElementById("t5-" + id);
      // Word starts from 05-step-2-add.words.json (seconds from frame start). The sign-in click
      // and the ping after Test key are the cues in sfx-cues.json (sign +0.8, test +0.43).
      const ANYROUTER = 1.58, SIGN_CLICK = 1.98, OPEN = 2.57, BRING = 2.99, YOUR = 3.50;
      const PICK = 4.55, OPENROUTER = 4.68, PASTE = 5.74, TEST = 7.17, VALID = 7.6, ADD = 8.21;

      const show = (id, t, d = 0.2) => tl.fromTo($(id), { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const hide = (id, t, d = 0.2) => tl.to($(id), { opacity: 0, duration: d, ease: "power2.out" }, t);
      const press = (id, t) => {
        tl.to($(id), { scale: 0.95, duration: 0.07, ease: "power2.in" }, t);
        tl.to($(id), { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.07);
      };
      gsap.set([$("byok"), $("form"), $("val"), $("valid"), $("scrim"), $("dialog"), $("url-b")], { opacity: 0 });

      tl.fromTo($("step"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.04);

      // "sign into AnyRouter": the real sign-in, Continue with GitHub.
      show("ring-gh", ANYROUTER);
      tl.to($("ring-gh"), { scale: 0.97, duration: 0.07, ease: "power2.in" }, SIGN_CLICK);
      tl.to($("ring-gh"), { scale: 1, duration: 0.12, ease: "power2.out" }, SIGN_CLICK + 0.07);

      // "open the Bring Your Own Key page"
      hide("signin", OPEN - 0.25);
      hide("url-a", OPEN - 0.1, 0.12);
      show("url-b", OPEN);
      tl.fromTo($("byok"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, OPEN);
      tl.fromTo($("ul"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, BRING);
      tl.fromTo($("byok-note"), { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, YOUR);

      // "Pick OpenRouter"
      show("ring-or", PICK - 0.1);
      press("chip-or", OPENROUTER);
      hide("byok", OPENROUTER + 0.25);
      tl.fromTo($("form"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, OPENROUTER + 0.4);

      show("ring-test", TEST - 0.2);
      press("test", TEST);
      hide("untested", VALID - 0.05, 0.1);
      tl.fromTo($("valid"), { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, VALID);

      hide("ring-test", ADD - 0.35);

      press("add", ADD);
      show("scrim", ADD + 0.15, 0.3);
