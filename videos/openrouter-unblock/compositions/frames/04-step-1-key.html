    (function () {
      const $ = (id) => document.getElementById("04-step-1-key-" + id);
      const tl = gsap.timeline({ paused: true });

      // Canvas points. Viewport origin is (385.5, 217.5): card (384, 164) + 1.5 border + 52 bar.
      const CREATE = { x: 1371.5, y: 371.5 };
      const COPY = { x: 1397.5, y: 567.5 };
      const PILL_ROW = { x: 660, y: 567.5 };
      const PILL_PARK = { x: 960, y: 790 };
      const CLICK_CREATE = 3.25; // "create"
      const CLICK_COPY = 4.23; // "copy"
      const at = (p) => ({ x: p.x - 2, y: p.y - 2 });

      gsap.set($("cursor"), { transformOrigin: "2px 2px" });
      gsap.set($("pill"), { xPercent: -50, yPercent: -50 });

      const press = (el, depth, t) => {
        tl.to(el, { scale: depth, duration: 0.06, ease: "power2.in" }, t);
        tl.to(el, { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
      };

      // Scene 1: rail already present; step 1 turns active; browser rises on openrouter.ai
      tl.fromTo($("c1-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c1-todo"), { opacity: 0 }, 0.55);
      tl.fromTo($("l1-on"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);
      tl.set($("l1-todo"), { opacity: 0 }, 0.5);
      tl.fromTo($("browser"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.05);
      tl.fromTo($("shot"), { scale: 1 }, { scale: 1.04, duration: 2.4, ease: "none" }, 0.1);

      // Scene 2: "Open keys" slides the same frame to the Keys page
      tl.fromTo($("strip"), { x: 0 }, { x: -1149, duration: 0.55, ease: "power3.inOut" }, 2.4);
      tl.to($("url-home"), { opacity: 0, duration: 0.2, ease: "power2.out" }, 2.57);
      tl.fromTo($("url-keys"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 2.57);
      tl.fromTo($("note"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.54);
      tl.fromTo($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 2.54);

      // Scene 3: cursor glides to Create Key on "click", presses on "create"
      tl.fromTo($("cursor"), { x: 1180, y: 700 }, { ...at(CREATE), duration: 0.62, ease: "power3.out" }, 2.54);
      press($("cursor"), 0.88, CLICK_CREATE);
      press($("create"), 0.95, CLICK_CREATE);
      tl.fromTo($("ripple-create"), { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, CLICK_CREATE);
      tl.to($("empty"), { opacity: 0, duration: 0.15, ease: "power2.out" }, CLICK_CREATE + 0.08);
      tl.fromTo($("row"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, CLICK_CREATE + 0.15);
      tl.fromTo($("pill"), { x: PILL_ROW.x, y: PILL_ROW.y + 12, opacity: 0 }, { x: PILL_ROW.x, y: PILL_ROW.y, opacity: 1, duration: 0.4, ease: "power3.out" }, CLICK_CREATE + 0.15);

      // Scene 4: click Copy on "copy", toast, the key lifts out and parks at (960, 790)
      tl.to($("cursor"), { ...at(COPY), duration: 0.5, ease: "power2.inOut" }, 3.65);
      press($("cursor"), 0.88, CLICK_COPY);
      press($("copy"), 0.95, CLICK_COPY);
      tl.fromTo($("ripple-copy"), { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, CLICK_COPY);
      tl.fromTo($("toast"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, CLICK_COPY + 0.04);
      tl.fromTo($("glyph-on"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, CLICK_COPY + 0.1);
      tl.set($("glyph-off"), { opacity: 0 }, CLICK_COPY + 0.35);
      tl.fromTo($("pill-shadow"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, CLICK_COPY + 0.12);
      tl.to($("pill"), { x: PILL_PARK.x, y: PILL_PARK.y, duration: 0.55, ease: "power2.inOut" }, CLICK_COPY + 0.12);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-step-1-key"] = tl;
    })();
