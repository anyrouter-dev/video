  <div id="root" data-composition-id="01-wall" data-width="1920" data-height="1080" data-duration="13.717">

    <div id="t1-stage" class="stage clip" data-start="0" data-duration="13.717" data-track-index="1">
      <div class="safe">
        <div class="scene wall">
          <div class="term" id="t1-term">
            <div class="term-bar">
              <div class="term-dots"><i></i><i></i><i></i></div>
              <div class="term-title mono">~/my-app</div>
              <svg class="term-mark" viewBox="0 0 24 24" fill="#A1A1AA" aria-hidden="true"><path d="M18.654 3.87a5.087 5.087 0 110 10.174L23.7 19.09c.64.641.187 1.737-.72 1.737H8.48a8.479 8.479 0 010-16.958h10.175zM8.479 7.26a5.087 5.087 0 100 10.176 5.087 5.087 0 000-10.175z"/></svg>
            </div>

              <div class="line" id="t1-head"><span class="dim">model  </span><span class="model">openrouter/free</span></div>

            <div class="stat tier" id="t1-s3"><span class="num" id="t1-n3">1000</span><span class="lab" id="t1-l3">a day after $10 of credits</span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById("t1-" + id);
      // Word starts from 01-wall.words.json (seconds from frame start).
      const ERRORS = 2.96, THATS = 6.07, LIMIT = 6.38, ACCOUNT = 7.40, TWENTY = 7.75, FIFTY = 9.01, THOUSAND = 10.27;
      const VISIBLE = 5;
      const tl = gsap.timeline({ paused: true });
      // The line pitch differs per orientation (CSS), so it is read from the header line.
      const LINE_H = $("head").offsetHeight;

      tl.fromTo($("term"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);

      // The day's requests #45-#50 answer 200; from #51, on "errors", every one is 429 (50 a day).
      // The first three 429s carry the error sounds (sfx-cues.json: errors, +0.4, +0.73).
      const at = [0.45, 0.8, 1.15, 1.5, 1.85, 2.2, ERRORS, ERRORS + 0.4, ERRORS + 0.73];
      for (let gap = 0.3; at.length < 18; gap = Math.max(0.1, gap * 0.82)) at.push(+(at.at(-1) + gap).toFixed(3));

      const span = (cls, text) => {
        const s = document.createElement("span");
        if (cls) s.className = cls;
        s.textContent = text;
        return s;
      };
      const lines = at.map((t, i) => {
        const ok = i < 6;
        const line = document.createElement("div");
        line.className = "line";
        line.style.top = i * LINE_H + "px";
        line.append(span("dim", "#" + (45 + i) + "  "), ok ? span("ok", "200 OK") : span("err", "429 Too Many Requests"));
        $("log").appendChild(line);
        tl.fromTo(line, { opacity: 0 }, { opacity: 1, duration: 0.06 }, t);
        return line;
      });
      lines.forEach((line, i) => {
        if (i < VISIBLE) return;
        const t = at[i];
        tl.fromTo($("log"), { y: -(i - VISIBLE) * LINE_H }, { y: -(i - VISIBLE + 1) * LINE_H, duration: Math.min(0.12, (t - at[i - 1]) * 0.8), ease: "power2.out", immediateRender: false }, t);
        tl.set(lines[i - VISIBLE], { opacity: 0 }, t + 0.06);
      });

      // "That's a rate limit": the log clears first, then the definition and the account's limits.
      tl.to($("term"), { y: -32, opacity: 0, duration: 0.3, ease: "power2.in" }, THATS - 0.45);
      tl.fromTo($("h1"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, THATS - 0.1);
      tl.fromTo($("lede"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, LIMIT);
      tl.fromTo($("acct"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, ACCOUNT);
      const stat = (n, t) => {
        tl.fromTo($("s" + n), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo($("n" + n), { scale: 0.6 }, { scale: 1, duration: 0.55, ease: "power3.out" }, t);
        tl.fromTo($("l" + n), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t + 0.12);
      };
      stat(1, TWENTY);
      stat(2, FIFTY);
      stat(3, THOUSAND);
      tl.set({}, {}, 13.717);

      window.__timelines["01-wall"] = tl;
    })();
  </script>
