    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const ID = "01-wall";
        const DURATION = 11.728;
        const $ = (s) => document.getElementById(ID + "-" + s);

        const LINE_H = 46;
        const VISIBLE = 10;
        const BODY_H = 360;
        const TERM_SHIFT_X = 120 - 290;
        const TERM_SCALE = 0.62;

        const tl = gsap.timeline({ paused: true });

        tl.fromTo($("term"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);

        // Log schedule: steady 200s, then 429s on a geometric hold decay into a flurry.
        // 429s begin on "errors" (2.86); ERR_HOLD lands the first scroll (11th line) on "requests," (4.41).
        const OK_START = 0.6, OK_HOLD = 0.42;
        const ERR_START = 2.86, ERR_HOLD = 0.40, ERR_DECAY = 0.82, ERR_FLOOR = 0.11;
        const CONTENT = [
          ...Array.from({ length: 4 }, () => ({ kind: "ok" })),
          ...Array.from({ length: 12 }, () => ({ kind: "err" })),
        ];
        let okT = OK_START, errT = ERR_START, errI = 0;
        const TIMELINE = CONTENT.map((entry) => {
          if (entry.kind === "ok") {
            const at = okT;
            okT += OK_HOLD;
            return { ...entry, at, hold: OK_HOLD };
          }
          const hold = Math.max(ERR_FLOOR, ERR_HOLD * Math.pow(ERR_DECAY, errI));
          const at = errT;
          errT += hold;
          errI += 1;
          return { ...entry, at, hold };
        });

        const log = $("log");
        const span = (cls, text) => {
          const s = document.createElement("span");
          if (cls) s.className = cls;
          s.textContent = text;
          return s;
        };

        TIMELINE.forEach((entry, i) => {
          const line = document.createElement("p");
          line.className = ID + "-line";
          line.style.top = i * LINE_H + "px";
          line.append(
            span("", "POST /api/v1/chat/completions  "),
            span(ID + "-model", "openrouter/free"),
            span(ID + "-dim", "  → "),
            entry.kind === "ok"
              ? span(ID + "-ok", "200 OK")
              : span(ID + "-err", "429 Too Many Requests"),
          );
          log.appendChild(line);

          tl.set(line, { opacity: 1 }, entry.at);
          if (i >= VISIBLE) {
            tl.fromTo(
              log,
              { y: -(i - VISIBLE) * LINE_H },
              { y: -(i - VISIBLE + 1) * LINE_H, duration: Math.min(0.09, entry.hold * 0.8), ease: "power2.out", immediateRender: false },
              entry.at,
            );
          }
        });

        // Scene 3: the log steps aside, the definition card rises into the space.
        tl.fromTo(
          $("term"),
          { x: 0, scale: 1 },
          { x: TERM_SHIFT_X, scale: TERM_SCALE, duration: 0.9, ease: "power2.inOut", immediateRender: false },
          5.43,
        );
        tl.fromTo($("def"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 5.72);
        tl.fromTo($("defn"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 6.59);

        // Scene 4: the card body grows down from under the definition to hold the limits.
        tl.fromTo($("sheet"), { y: -BODY_H }, { y: 0, duration: 0.5, ease: "power3.out" }, 9.03);

        const stat = (n, l, at) => {
          tl.fromTo($(n), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, at);
          tl.fromTo($(l), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, at + 0.12);
        };
        stat("n1", "l1", 9.56);
        stat("n2", "l2", 10.53);
        tl.fromTo($("foot"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 10.87);

        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
