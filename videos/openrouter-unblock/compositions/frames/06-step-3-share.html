      <div class="note" id="06-step-3-share-note-free" style="left:120px;top:300px">
        <svg viewBox="0 0 28 28" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12.5" width="18" height="12" rx="3"/><path d="M9.5 12.5V9a4.5 4.5 0 0 1 8.7-1.6"/></svg>
        <div>On the Free plan, sharing unlocks the pool</div>
      </div>
      <div class="note" id="06-step-3-share-note-first" style="left:1552px;top:300px">
        <svg viewBox="0 0 28 28" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 23V5M7 12l7-7 7 7"/></svg>
        <div>Your own requests always come first</div>
      </div>
      <div class="note" id="06-step-3-share-note-off" style="left:1552px;top:536px">
        <svg viewBox="0 0 28 28" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="23" height="12" rx="6"/><circle cx="8.5" cy="14" r="3"/></svg>
        <div>Turn sharing off any time</div>
      </div>

      <div class="ripple" id="06-step-3-share-ripple-share" style="left:1410.5px;top:525.5px"></div>
      <div class="ripple" id="06-step-3-share-ripple-box" style="left:0px;top:0px"></div>
      <div class="ripple" id="06-step-3-share-ripple-donate" style="left:0px;top:0px"></div>

      <svg class="cursor" id="06-step-3-share-cursor" width="28" height="34" viewBox="0 0 28 34"><path d="M2 2 L2 27 L8.5 21 L13 31.5 L17.5 29.5 L13 19.5 L22 19.5 Z" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById("06-step-3-share-" + id);
      const tl = gsap.timeline({ paused: true });

      // Canvas hot spots. Viewport origin is (385.5, 217.5): card 384,164 + 1.5 border, + 52 bar.
      const START = { x: 1180, y: 770 };
      const SHARE = { x: 1438.5, y: 553.5 };
      const PARK = { x: 1505, y: 640 };
      const BOX = { x: 490.5, y: 713.5 };
      const DONATE = { x: 1303.5, y: 729.5 };
      const GOT_IT_REST = { x: 1262, y: 652 };

      // Word starts (06-step-3-share.words.json)
      const TURN = 0.94;
      const POOL = 2.13;
      const FREE = 3.01;
      const POOL_2 = 5.39;
      const OTHER = 6.21;
      const SHOW = 8.52;
      const YOURS = 11.14;
      const FIRST = 12.03;
      const TURN_OFF = 13.08;

      const CLICK_BOX = FIRST;
      const CLICK_DONATE = 12.55;
      const CONSENT_OUT = 13.25;
      const RESULT = 13.58;

      const at = (p) => ({ x: p.x - 2, y: p.y - 2 });
      gsap.set($("cursor"), { transformOrigin: "2px 2px" });
      gsap.set($("ripple-box"), { left: BOX.x - 28, top: BOX.y - 28 });
      gsap.set($("ripple-donate"), { left: DONATE.x - 28, top: DONATE.y - 28 });

      const press = (target, ripple, t) => {
        tl.to($("cursor"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, t);
        tl.to($("cursor"), { scale: 1, duration: 0.06, ease: "power2.out" }, t + 0.06);
        if (target) {
          tl.to(target, { scale: 0.95, duration: 0.06, ease: "power2.in" }, t);
          tl.to(target, { scale: 1, duration: 0.06, ease: "power2.out" }, t + 0.06);
        }
        tl.fromTo($(ripple), { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
      };

      // Hidden states held from t=0
      tl.set([$("c2-done"), $("l2-done"), $("c3-on"), $("l3-on"), $("c3-done"), $("l3-done")], { opacity: 0 }, 0);
      tl.set([$("ripple-share"), $("ripple-box"), $("ripple-donate")], { scale: 0, opacity: 0 }, 0);
      tl.set([$("scrim"), $("consent"), $("result"), $("box-on"), $("donate-busy")], { opacity: 0 }, 0);
      tl.set([$("li1"), $("li2"), $("li3"), $("li4")], { opacity: 0 }, 0);
      tl.set([$("note-free"), $("note-first"), $("note-off")], { opacity: 0 }, 0);
      tl.set($("ring"), { attr: { "stroke-dashoffset": 1 } }, 0);
      tl.set($("donate"), { opacity: 0.45 }, 0);

      // Rail: step 2 done, step 3 active at 0.2s
      tl.fromTo($("c2-done"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c2-active"), { opacity: 0 }, 0.55);
      tl.to($("l2-done"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);
      tl.fromTo($("c3-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.2);
      tl.set($("c3-todo"), { opacity: 0 }, 0.55);
      tl.to($("l3-on"), { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.2);

      // Scene 1: ring draws on "turn", cursor reaches the switch by "pool" and clicks on the second "pool"
      tl.fromTo($("cursor"), { ...at(START), opacity: 0 }, { ...at(START), opacity: 1, duration: 0.25, ease: "power2.out" }, 0.06);
      tl.to($("ring"), { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, TURN);
      tl.to($("cursor"), { ...at(SHARE), duration: 0.7, ease: "power2.inOut" }, 1.3);
      press($("share"), "ripple-share", POOL_2);

      // Scene 2: consent dialog rises; the panel it covers goes to 0 as it lands
      tl.to($("scrim"), { opacity: 1, duration: 0.3, ease: "power2.out" }, POOL_2 + 0.06);
      tl.fromTo($("consent"), { y: 40, scale: 0.96, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, POOL_2 + 0.12);
      tl.to($("panel"), { opacity: 0, duration: 0.12, ease: "power2.out" }, POOL_2 + 0.08);
      tl.to($("cursor"), { ...at(PARK), duration: 0.5, ease: "power2.inOut" }, POOL_2 + 0.14);

      // Chip on "free"
      tl.fromTo($("note-free"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, FREE);

      // In short lines, in step with the voice
      tl.fromTo($("li1"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, OTHER);
      ["li2", "li3", "li4"].forEach((id, i) => {
        tl.fromTo($(id), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, SHOW + i * 0.25);
      });

      // Chip on "Yours"
      tl.fromTo($("note-first"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, YOURS);

      // Tick on "first", then Donate key (disabled until ticked)
      tl.to($("cursor"), { ...at(BOX), duration: 0.55, ease: "power2.inOut" }, CLICK_BOX - 0.6);
      press(null, "ripple-box", CLICK_BOX);
      tl.fromTo($("box-on"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.15, ease: "power3.out" }, CLICK_BOX + 0.02);
      tl.to($("donate"), { opacity: 1, duration: 0.15, ease: "power2.out" }, CLICK_BOX + 0.04);
      tl.to($("cursor"), { ...at(DONATE), duration: 0.32, ease: "power2.inOut" }, CLICK_BOX + 0.14);
      press($("donate"), "ripple-donate", CLICK_DONATE);
      tl.to($("cursor"), { x: DONATE.x + 112, y: DONATE.y + 32, duration: 0.25, ease: "power2.out" }, CLICK_DONATE + 0.14);
      tl.set($("donate-idle"), { opacity: 0 }, CLICK_DONATE + 0.04);
      tl.to($("donate-busy"), { opacity: 1, duration: 0.08, ease: "power2.out" }, CLICK_DONATE + 0.04);
      tl.fromTo($("spin"), { rotation: 0 }, { rotation: 540, duration: RESULT - CLICK_DONATE, ease: "none", transformOrigin: "50% 50%" }, CLICK_DONATE + 0.04);

      // Last chip on the second "turn"
      tl.fromTo($("note-off"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, TURN_OFF);

      // Scene 3: consent fully out, then the result; step 3 checks; hold
      tl.to($("consent"), { scale: 0.97, opacity: 0, duration: 0.3, ease: "power2.in" }, CONSENT_OUT);
      tl.fromTo($("result"), { y: 14, scale: 0.94, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, RESULT);
      tl.fromTo($("live-check"), { scale: 0.5 }, { scale: 1, duration: 0.3, ease: "power3.out", transformOrigin: "50% 50%" }, RESULT);
      tl.to($("cursor"), { ...at(GOT_IT_REST), duration: 0.3, ease: "power2.out" }, RESULT);
      tl.fromTo($("c3-done"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, RESULT);
      tl.to($("l3-done"), { opacity: 1, duration: 0.3, ease: "power2.out" }, RESULT);
      tl.set([$("c3-on"), $("l3-on")], { opacity: 0 }, RESULT + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-step-3-share"] = tl;
    })();
  </script>
</template>
