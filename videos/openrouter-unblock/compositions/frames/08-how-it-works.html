  <script>
    (function () {
      const $ = (id) => document.getElementById("t8-" + id);
      // Word starts from 08-how-it-works.words.json (seconds from frame start). The pings on
      // "keys" (+0, +0.5, +1.0) and the chime on the third "your" are in sfx-cues.json.
      const FIRST = 2.68, LIMIT = 3.55, STOPS = 4.45, USING = 4.80, KEYS = 7.67, THEN = 10.13, YOUR = 10.30;
      const TRAVEL = 0.45;
      const tl = gsap.timeline({ paused: true });
      const show = (id, t, d = 0.2) => tl.fromTo($(id), { opacity: 0 }, { opacity: 1, duration: d, ease: "power2.out" }, t);
      const hide = (id, t, d = 0.2) => tl.to($(id), { opacity: 0, duration: d, ease: "power2.out" }, t);
      gsap.set(["s0-ok", "s0-err", "s0-wait", "s0-back", "s1", "s2", "s3", "g0", "g1", "g2", "g3", "f1", "f2"].map($), { opacity: 0 });

      // One request: along app → AnyRouter, then AnyRouter → keys, arriving at `arrive`.
      const request = (arrive) => {
        const t = arrive - TRAVEL;
        tl.fromTo($("f1"), { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power1.in", immediateRender: false }, t);
        tl.fromTo($("f2"), { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false }, t + 0.2);
        tl.to([$("f1"), $("f2")], { opacity: 0, duration: 0.15, ease: "power2.out" }, arrive);
      };
      const badge = (id, t) => tl.fromTo($(id), { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, t);

      tl.fromTo($("h2"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo([$("app"), $("w1"), $("ar"), $("w2"), $("keys")], { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.06 }, 0.2);

      // "AnyRouter tries your key first."
      request(FIRST - 0.1);
      show("g0", FIRST - 0.1);
      badge("s0-ok", FIRST);

      // "When your key hits the limit, AnyRouter stops using it for a short time"
      request(LIMIT - 0.1);
      hide("s0-ok", LIMIT - 0.05, 0.1);
      badge("s0-err", LIMIT);
      hide("g0", STOPS);
      tl.to($("k0"), { opacity: 0.45, duration: 0.3, ease: "power2.out" }, STOPS);
      hide("s0-err", USING - 0.05, 0.1);
      badge("s0-wait", USING);

      // "and sends the next requests to keys other members shared": one request per key.
      [1, 2, 3].forEach((n, i) => {
        const at = KEYS + i * 0.5;
        request(at);
        show("g" + n, at - 0.05);
        badge("s" + n, at);
        hide("g" + n, at + 0.45);
      });

      // "Then it uses your key again."
      tl.to($("k0"), { opacity: 1, duration: 0.3, ease: "power2.out" }, THEN);
      request(YOUR);
      show("g0", YOUR - 0.05);
      hide("s0-wait", YOUR - 0.05, 0.1);
      badge("s0-back", YOUR);
      tl.set({}, {}, 12.51);

      window.__timelines["08-how-it-works"] = tl;
    })();
