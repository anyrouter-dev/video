  <script>
    (function () {
      const $ = (id) => document.getElementById("08-how-it-works-" + id);
      const tl = gsap.timeline({ paused: true });

      // Every request rides one route: a straight run from the app through the hub
      // (packets pass under the hub card), then the hub-to-key curve drawn in the SVG.
      const APP_X = 460;
      const HUB_OUT = 1060;
      const KEY_X = 1300;
      const MID_Y = 470;
      const KEY_Y = { you: 262, p1: 408, p2: 478, p3: 548, p4: 618, p5: 688 };

      const bez = (ky, t) => {
        const u = 1 - t;
        const x = u * u * u * HUB_OUT + 3 * u * u * t * 1180 + 3 * u * t * t * 1180 + t * t * t * KEY_X;
        const y = u * u * u * MID_Y + 3 * u * u * t * MID_Y + 3 * u * t * t * ky + t * t * t * ky;
        return { x, y };
      };
      const curveLen = (ky) => {
        let len = 0;
        let prev = bez(ky, 0);
        for (let i = 1; i <= 40; i++) {
          const p = bez(ky, i / 40);
          len += Math.hypot(p.x - prev.x, p.y - prev.y);
          prev = p;
        }
        return len;
      };
      const route = (ky) => {
        const lineLen = HUB_OUT - APP_X;
        const split = lineLen / (lineLen + curveLen(ky));
        return (s) => (s <= split
          ? { x: APP_X + lineLen * (s / split), y: MID_Y }
          : bez(ky, (s - split) / (1 - split)));
      };

      // One request at a time. k3..k6 each go to a different pool key, 0.5s apart.
      const PACKETS = [
        { id: "k1", key: "you", at: 1.03, dur: 0.88 },
        { id: "k2", key: "you", at: 2.3, dur: 0.74, bounce: true },
        { id: "k3", key: "p1", at: 5.08, dur: 0.75 },
        { id: "k4", key: "p2", at: 5.58, dur: 0.75 },
        { id: "k5", key: "p3", at: 6.08, dur: 0.75 },
        { id: "k6", key: "p4", at: 6.58, dur: 0.75 },
        { id: "k7", key: "you", at: 8.34, dur: 0.68 },
      ];

      PACKETS.forEach((pk) => {
        const el = $(pk.id);
        const pos = route(KEY_Y[pk.key]);
        const proxy = { s: 0 };
        const place = () => gsap.set(el, pos(proxy.s));
        gsap.set(el, { xPercent: -50, yPercent: -50, opacity: 0, ...pos(0) });
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out", immediateRender: false }, pk.at);
        tl.fromTo(proxy, { s: 0 }, { s: 1, duration: pk.dur, ease: "power1.inOut", immediateRender: false, onUpdate: place }, pk.at);
        const arrive = pk.at + pk.dur;
        if (pk.bounce) {
          tl.fromTo(proxy, { s: 1 }, { s: 0.9, duration: 0.3, ease: "power2.out", immediateRender: false, onUpdate: place }, arrive);
          tl.fromTo(el, { backgroundColor: "#BB4D00", boxShadow: "0 0 0 7px rgba(187, 77, 0, 0.16)" }, { backgroundColor: "#C0262D", boxShadow: "0 0 0 7px rgba(192, 38, 45, 0.18)", duration: 0.12, ease: "power1.out", immediateRender: false }, arrive);
          tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.out" }, arrive + 0.12);
        } else {
          tl.to(el, { scale: 0, opacity: 0, duration: 0.12, ease: "power2.in" }, arrive);
          tl.fromTo($(pk.key + "-body"), { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, arrive);
        }
        pk.arrive = arrive;
      });
      const ARR = Object.fromEntries(PACKETS.map((pk) => [pk.id, pk.arrive]));

      const chipIn = (id, at) => tl.fromTo($(id), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, at);
      const swap = (id, from, to, dur, at) => tl.fromTo($(id), { opacity: from }, { opacity: to, duration: dur, ease: "power2.out", immediateRender: false }, at);
      const draw = (ids, at, stagger) => tl.fromTo(ids.map($), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: stagger || 0 }, at);
      const slideIn = (ids, at, stagger) => tl.fromTo(ids.map($), { x: -12, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: stagger || 0 }, at);
      const HOLD = 9.4;

      // Scene 1: the app is on screen from the cut; request 1 tries your key first.
      tl.fromTo($("cam"), { scale: 1 }, { scale: 1.015, duration: HOLD, ease: "none" }, 0);
      tl.fromTo($("app"), { y: 16 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      draw(["w-app"], 0.22);
      tl.fromTo($("hub"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.3);
      draw(["w-you"], 1.2);
      slideIn(["you-label", "you"], 1.4);
      gsap.set($("resting"), { opacity: 0 });
      gsap.set([$("ring"), $("sweep")], { opacity: 0 });
      chipIn("c-you-a", ARR.k1);

      // Scene 2: request 2 gets 429 on "limited"; your key dims, then rests.
      swap("c-you-a", 1, 0, 0.2, 2.82);
      chipIn("c-you-429", ARR.k2);
      swap("you-body", 1, 0.4, 0.4, 3.1);
      swap("you-glyph-on", 1, 0, 0.3, 3.1);
      const REST = 3.92;
      const BACK = 8.28;
      swap("ring", 0, 1, 0.25, REST);
      tl.fromTo($("sweep"), { opacity: 1, strokeDashoffset: 1 }, { opacity: 1, strokeDashoffset: 0, duration: BACK - REST, ease: "none", immediateRender: false }, REST);
      tl.fromTo($("resting"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, REST);

      // Scene 3: the pool appears; four requests, one per shared key.
      draw(["w-p1", "w-p2", "w-p3", "w-p4", "w-p5"], 4.69, 0.05);
      slideIn(["pool-label"], 4.69);
      slideIn(["p1", "p2", "p3", "p4", "p5"], 4.74, 0.05);
      chipIn("c-p1", ARR.k3);
      chipIn("c-p2", ARR.k4);
      chipIn("c-p3", ARR.k5);
      chipIn("c-p4", ARR.k6);
      tl.fromTo($("each"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.83);

      // Scene 4: the ring completes, your key returns and takes the last request.
      swap("you-body", 0.4, 1, 0.35, BACK);
      swap("you-glyph-on", 0, 1, 0.3, BACK);
      swap("resting", 1, 0, 0.25, BACK);
      swap("c-you-429", 1, 0, 0.25, BACK);
      swap("ring", 1, 0, 0.3, BACK + 0.1);
      tl.fromTo($("head"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 8.76);
      chipIn("c-you-b", ARR.k7);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-how-it-works"] = tl;
    })();
  </script>
