    (function () {

      const tl = gsap.timeline({ paused: true });

      // Frame 2 hands the pill over centred at (960, 430). Its slot in the card:
      // card left 160 + border 1.5 + pad 32 + half the pill width (403.6 / 2);
      // card top 288 + border 1.5 + slot centre 126.
      const HANDOFF = { x: 960, y: 430 };
      const SLOT = { x: 395.3, y: 415.5 };
      // Request dot centres: parked left of your key, then on the lit pool key (k3)
      const DOT_IN = { x: 100, y: SLOT.y };
      const DOT_KEY = { x: 177, y: SLOT.y };
      const DOT_POOL = { x: 682, y: 563.5 };
      const CARD_SHADOW = "0 1px 2px rgba(10,10,10,.04), 0 12px 40px rgba(10,10,10,.06)";

      gsap.set([$("pill"), $("req")], { xPercent: -50, yPercent: -50 });
      gsap.set($("pill"), { x: HANDOFF.x, y: HANDOFF.y });
      gsap.set($("payoff"), { xPercent: -50 });

      // Scene 1: "AnyRouter keeps your key." The card rises in; the key glides into its slot
      tl.fromTo($("card"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.04);
      tl.fromTo(
        $("card"),
        { scale: 0.94, borderRadius: 36, boxShadow: "0 0px 0px rgba(10,10,10,0), 0 0px 0px rgba(10,10,10,0)" },
        { scale: 1, borderRadius: 20, boxShadow: CARD_SHADOW, duration: 0.9, ease: "power2.inOut" },
        0.04
      );
      tl.fromTo($("head"), { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 0.3);
      tl.fromTo($("pill"), { x: HANDOFF.x, y: HANDOFF.y }, { x: SLOT.x, y: SLOT.y, duration: 0.8, ease: "power2.inOut" }, 0.66); // "keeps"

      // Scene 2: "When it hits the limit," a request reaches your key and bounces off a 429
