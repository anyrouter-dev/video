        tl.fromTo($("limit"), { opacity: 0, x: -16, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.4, ease: "back.out(1.6)", immediateRender: false }, LIMIT);
        tl.to(d0, { x: ar.x, y: ar.y, duration: 0.45, ease: "power2.inOut" }, LIMIT + 0.15);

        // AnyRouter picks a key another member shares; the request goes there instead
        const ring = $("ring");
        tl.set(ring, K.box(ring, $("ar"), 12), 0);
        tl.fromTo(ring, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, AR);
        // one request takes one shared key that has room
        tl.to(d0, { x: pool[1].x, y: pool[1].y, duration: 0.6, ease: "power2.inOut" }, SEND);
        tl.to(pills[1], { borderColor: "#BB4D00", backgroundColor: "#FFF4EC", duration: 0.25, ease: "power2.out" }, SEND + 0.55);
        tl.to(ring, { opacity: 0, duration: 0.3 }, KEYS);

        // and the answers come back to your app
        tl.to(d0, { x: ar.x, y: ar.y, backgroundColor: "#007E55", boxShadow: "0 0 0 8px rgba(0,126,85,.18)", duration: 0.35, ease: "power2.inOut" }, BACK);
        tl.to(d0, { x: app.x, y: app.y, duration: 0.35, ease: "power2.inOut" }, BACK + 0.35);
        tl.to(d0, { opacity: 0, duration: 0.15 }, BACK + 0.65);
        tl.to($("app"), { borderColor: "#007E55", duration: 0.25 }, BACK + 0.6);
        tl.fromTo($("ok"), { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)", immediateRender: false }, BACK + 0.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-reroute"] = tl;
      });
    })();
  </script>
