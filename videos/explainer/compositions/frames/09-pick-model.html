  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    (function () {
      const DURATION = 10.64;
      const byId = (id) => document.getElementById("09-pick-model-" + id);
      const card = byId("card");
      const cmd = byId("cmd");
      const idEl = byId("id");
      const caret = byId("caret");
      const rows = [0, 1, 2].map((i) => byId("row-" + i));
      const oldLines = card.querySelectorAll('[class~="09-pick-model-old"]');
      const part = (row, name) => row.querySelectorAll('[class~="09-pick-model-' + name + '"]');

      const tl = gsap.timeline({ paused: true });

      // Compact card: title bar 56 + body (30 pad + 54.4 line + 30 pad) = 170.4px tall.
      tl.to(oldLines, { opacity: 0, duration: 0.36, ease: "power2.out" }, 0.04);
      tl.to(cmd, { y: -286, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to(byId("filler"), { scaleY: 94.4 / 484, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to(byId("cap"), { y: -389.6, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to(byId("shadow-big"), { opacity: 0, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to(byId("shadow-small"), { opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0.4);
      tl.to(card, { x: 67, y: -20, scale: 0.9, duration: 0.8, ease: "power2.inOut" }, 0.4);

      [0.89, 1.03, 1.17].forEach((t, i) => {
        tl.fromTo(rows[i], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, t);
        // The last row has no divider under it.
        const rule = part(rows[i], "rule");
        if (rule.length) tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, t + 0.08);
      });

      function light(i, t) {
        const row = rows[i];
        tl.to(part(row, "off"), { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo([...part(row, "on"), ...part(row, "on-free")], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.fromTo(part(row, "row-bg"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, t);
        tl.fromTo(part(row, "row-bar"), { opacity: 1, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, t);
        if (i > 0) {
          const prev = rows[i - 1];
          tl.to([...part(prev, "row-bg"), ...part(prev, "row-bar")], { opacity: 0, duration: 0.3, ease: "power2.out" }, t);
        }
      }
      light(0, 2.13);
      light(1, 4.42);
      light(2, 7.02);

      const SEQUENCE = [
        { t: 0, text: "anyrouter/free" },
        { t: 4.2, text: "anyrouter/fre" },
        { t: 4.25, text: "anyrouter/fr" },
        { t: 4.3, text: "anyrouter/f" },
        { t: 4.35, text: "anyrouter/" },
        { t: 4.42, text: "anyrouter/a" },
        { t: 4.48, text: "anyrouter/au" },
        { t: 4.54, text: "anyrouter/aut" },
        { t: 4.6, text: "anyrouter/auto" },
        { t: 6.89, text: "anyrouter/aut" },
        { t: 6.92, text: "anyrouter/au" },
        { t: 6.95, text: "anyrouter/a" },
        { t: 6.98, text: "anyrouter/" },
        { t: 7.02, text: "anyrouter/c" },
        { t: 7.07, text: "anyrouter/co" },
        { t: 7.12, text: "anyrouter/cod" },
        { t: 7.17, text: "anyrouter/codi" },
        { t: 7.22, text: "anyrouter/codin" },
        { t: 7.27, text: "anyrouter/coding" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return SEQUENCE[0].text;
      }
      const driver = { t: 0 };
      tl.to(driver, {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: () => { idEl.textContent = textAt(driver.t); },
      }, 0);

      // Caret stays solid while keys are pressed and blinks only in the idle windows.
      tl.set(caret, { opacity: 1 }, 0);
      [[0, 4.2], [4.66, 6.89], [7.33, DURATION]].forEach(([from, to]) => {
        tl.set(caret, { opacity: 1 }, from);
        let on = true;
        for (let t = from + 0.5; t < to; t += 0.5) {
          on = !on;
          tl.set(caret, { opacity: on ? 1 : 0 }, t);
        }
      });

      tl.set({}, {}, DURATION);
      window.__timelines = window.__timelines || {};
      window.__timelines["09-pick-model"] = tl;
    })();
  </script>
