  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
  <script>
    (function () {
      const $ = (s) => document.getElementById("f09-" + s);
      const DURATION = parseFloat($("stage").parentElement.dataset.duration);
      const BLINK_HALF = 0.5;
      // A card the voice has moved past goes muted, not faded: faded text would drop under 4.5:1.
      const QUIET = "#636363";
      // Word starts from 09-pick-model.words.json ("Free", "Auto", "Coding"); retypes on the typing cues in sfx-cues.json.
      const CARD_AT = [1.95, 3.75, 6.14];

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const term = $("term");
        const title = $("title");
        const l1 = $("l1");
        const l6 = $("l6");

        // Per-character sets for the model id; seek() suppresses onUpdate drivers.
        const chars = (text, visible) => [...text].map((ch) => {
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.display = visible ? "inline" : "none";
          $("word").appendChild(span);
          return span;
        });
        const free = chars("free", true);
        const auto = chars("auto", false);
        const coding = chars("coding", false);
        function retype(from, to, t) {
          from.slice().reverse().forEach((span, i) => tl.set(span, { display: "none" }, t + i * 0.035));
          const typeAt = t + from.length * 0.035 + 0.02;
          to.forEach((span, i) => tl.set(span, { display: "inline" }, typeAt + i * 0.05));
          return typeAt + to.length * 0.05;
        }

        // Measured after the id is in place: in portrait "anyrouter/free" wraps the command onto a second line.
        // The terminal settles into the title's place and shrinks to its last line. Its height, not a
        // clip-path, animates so the kit's shadow and rounded corners match 08's last frame exactly.
        const padBottom = parseFloat(getComputedStyle($("body")).paddingBottom);
        const compact = l1.offsetTop + l6.offsetHeight + padBottom;
        tl.to([title, ...term.querySelectorAll('[class~="f09-old"]')], { opacity: 0, duration: 0.35, ease: "power2.inOut" }, 0.08);
        tl.to(term, { y: title.offsetTop - term.offsetTop, duration: 0.8, ease: "power2.inOut" }, 0.3);
        tl.fromTo(term, { height: term.offsetHeight }, { height: compact, duration: 0.8, ease: "power2.inOut" }, 0.3);
        tl.to(l6, { y: l1.offsetTop - l6.offsetTop, duration: 0.8, ease: "power2.inOut" }, 0.3);

        // Idle caret blink, timed back from `to` so the caret is solid when typing starts.
        function blink(el, from, to) {
          tl.set(el, { opacity: 1 }, from);
          const toggles = [];
          for (let t = to - BLINK_HALF; t > from + 0.25; t -= BLINK_HALF) toggles.push(t);
          if (toggles.length % 2) toggles.pop();
          toggles.forEach((t, i) => tl.set(el, { opacity: i % 2 ? 0 : 1 }, t));
        }

        const caret = $("caret");
        blink(caret, 0, 3.6);
        const autoEnd = retype(free, auto, 3.6);
        blink(caret, autoEnd, 6.04);
        const codingEnd = retype(auto, coding, 6.04);
        blink(caret, codingEnd, DURATION);

        // One focus ring, sized to the first card, moves to each card as the voice names it.
        const cards = ["free", "auto", "coding"].map((k) => $("card-" + k));
        const ring = $("ring");
        const first = cards[0];
        Object.assign(ring.style, {
          left: first.offsetLeft - 10 + "px",
          top: first.offsetTop - 10 + "px",
          width: first.offsetWidth + 20 + "px",
          height: first.offsetHeight + 20 + "px",
        });
        cards.forEach((card, i) => {
          tl.fromTo(card, { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, CARD_AT[i]);
          if (i === 0) {
            tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, CARD_AT[0] + 0.15);
            return;
          }
          tl.to(ring, { x: card.offsetLeft - first.offsetLeft, y: card.offsetTop - first.offsetTop, duration: 0.5, ease: "power2.inOut" }, CARD_AT[i]);
          tl.to(cards[i - 1].querySelectorAll('[class~="f09-id"], [class~="f09-desc"]'), { color: QUIET, duration: 0.4, ease: "power2.inOut" }, CARD_AT[i]);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["09-pick-model"] = tl;
      });
    })();
  </script>
