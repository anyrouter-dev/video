    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (s) => document.getElementById("f08-" + s);
        const DURATION = parseFloat($("stage").parentElement.dataset.duration);
        const BLINK_HALF = 0.5;

        const tl = gsap.timeline({ paused: true });

        // Per-character sets, spread evenly over [from, to]; seek() suppresses onUpdate drivers.
        // Returns the time each part's first character appears.
        function type(parts, from, to) {
          const chars = [];
          const firsts = [];
          for (const p of parts) {
            firsts.push(chars.length);
            for (const ch of p.text) {
              const span = document.createElement("span");
              span.textContent = ch;
              span.style.display = "none";
              p.el.appendChild(span);
              chars.push(span);
            }
          }
          const at = (i) => from + (i * (to - from)) / chars.length;
          chars.forEach((span, i) => tl.set(span, { display: "inline" }, at(i)));
          return firsts.map(at);
        }

        // Idle caret blink, timed back from `to` so the caret is solid when typing starts and at the frame's end.
        function blink(el, from, to) {
          tl.set(el, { opacity: 1 }, from);
          const toggles = [];
          for (let t = to - BLINK_HALF; t > from + 0.25; t -= BLINK_HALF) toggles.push(t);
          if (toggles.length % 2) toggles.pop();
          toggles.forEach((t, i) => tl.set(el, { opacity: i % 2 ? 0 : 1 }, t));
        }

        const show = (el, t) => tl.set(el, { opacity: 1 }, t);
        const hide = (el, t) => tl.set(el, { opacity: 0 }, t);

        // Wash the part of the command that just appeared, hold it, then let it fade.
        const HL = { backgroundColor: "rgba(240,145,90,0.32)", boxShadow: "0 0 0 4px rgba(240,145,90,0.32)" };
        const HL_OFF = { backgroundColor: "rgba(240,145,90,0)", boxShadow: "0 0 0 4px rgba(240,145,90,0)" };
        function highlight(el, t) {
          tl.set(el, { display: "inline", ...HL }, t);
          tl.fromTo(el, HL, { ...HL_OFF, duration: 0.8, ease: "power2.out", immediateRender: false }, t + 0.45);
        }

        // Times from 08-code-terminal.words.json and the typing / key-press cues in sfx-cues.json.
        tl.fromTo($("term"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo($("title"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.38);

        blink($("c1"), 0, 3.88);
        // Pasted, not typed: the whole line lands on "Install". The zero-width space lets the
        // portrait line break after "anyrouter.dev" (break-all never breaks before "/").
        type([{ el: $("t1"), text: "curl -fsSL https://anyrouter.dev​/setup.sh | bash" }], 3.88, 4.3);
        hide($("c1"), 4.45);
        show($("l2"), 4.55);

        show($("l3"), 6.26);
        blink($("c3"), 6.26, 6.79);
        type([{ el: $("t3"), text: "anyr login" }], 6.79, 7.7);
        hide($("c3"), 7.754);
        show($("l4"), 7.81);
        show($("l5"), 8.25);

        // The command grows the way you would edit it: claude, then anyr in front ("then run anyr
        // claude"), then a model on the end ("with a model"). Each new part is washed as it lands.
        show($("l6"), 8.4);
        type([{ el: $("t6"), text: "claude" }], 8.42, 8.6);
        highlight($("anyr"), 8.64);
        highlight($("flag"), 9.52);
        const [, idAt] = type([
          { el: $("t6flag"), text: " --model " },
          { el: $("t6id"), text: "anyrouter/free" },
        ], 9.52, 9.92);
        // Portrait wraps the id onto its own line; break there as typing reaches it, so the half-typed id never jumps lines.
        tl.set($("brk"), { display: "block" }, idAt);
        blink($("c6"), 9.92, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines["08-code-terminal"] = tl;
      })();
