    <script>
      (function () {
        const ID = "08-code-terminal";
        const DURATION = 10.192;
        const BLINK_HALF = 0.4;
        const $ = (s) => document.getElementById(ID + "-" + s);

        const tl = gsap.timeline({ paused: true });

        tl.fromTo($("card"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
        tl.fromTo($("eyebrow"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.27);

        function type(parts, start, cps) {
          // Per-character sets instead of an onUpdate driver: seek() suppresses callbacks.
          let i = 0;
          for (const p of parts) {
            for (const ch of p.text) {
              const span = document.createElement("span");
              span.textContent = ch;
              span.style.display = "none";
              p.el.appendChild(span);
              i += 1;
              tl.set(span, { display: "inline" }, start + i / cps);
            }
          }
          return start + i / cps;
        }

        function caret(el, on, typeStart, typeEnd, off) {
          const steps = [];
          const blink = (from, to) => {
            let visible = true;
            for (let t = from; t < to - 1e-6; t += BLINK_HALF) {
              steps.push([t, visible ? 1 : 0]);
              visible = !visible;
            }
          };
          blink(on, typeStart);
          steps.push([typeStart, 1]);
          blink(typeEnd, off);
          if (off < DURATION) steps.push([off, 0]);
          for (const [t, o] of steps) tl.set(el, { opacity: o }, t);
        }

        const reveal = (el, t) => tl.set(el, { opacity: 1 }, t);

        const curlEnd = type([{ el: $("t1"), text: "curl -fsSL https://anyrouter.dev/setup.sh | bash" }], 3.05, 25);
        caret($("c1"), 0, 3.05, curlEnd, 5.45);
        reveal($("l2"), 5.6);

        reveal($("l3"), 5.75);
        const loginEnd = type([{ el: $("t3"), text: "anyr login" }], 6.14, 20);
        caret($("c3"), 5.75, 6.14, loginEnd, 6.85);
        reveal($("l4"), 6.95);
        reveal($("l5"), 7.4);

        reveal($("l6"), 7.56);
        // 26 cps ends typing at ~9.2s so the blink cycle has the caret on at the last frame; Frame 9 opens caret-on.
        const claudeEnd = type([
          { el: $("t6"), text: "anyr claude --model " },
          { el: $("t6m"), text: "anyrouter/free" },
        ], 7.89, 26);
        caret($("c6"), 6.4, 6.8, claudeEnd, DURATION);

        // Frame 9 opens without the note.
        tl.fromTo($("note"), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 3.05);
        tl.to($("note"), { opacity: 0, duration: 0.3, ease: "power1.in" }, DURATION - 0.3);

        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
