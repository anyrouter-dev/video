  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="01-mess"]');
      const q = (cls) => Array.from(root.getElementsByClassName(cls));

      const cells = q("01-mess-cell");
      const tiles = q("01-mess-tile");
      const urls = q("01-mess-url");
      const keys = q("01-mess-key");
      const receipts = q("01-mess-receipt");
      const chars = q("01-mess-ch");

      // Word starts from 01-mess.words.json.
      const CUE = { there: 0.05, website: 3.37, key: 4.92, bill: 5.62, using: 6.43, messy: 7.76 };
      const LEAD = 0.12;

      const COLS = [-538, -158, 222, 602];
      const ROWS = [-280, -30, 220];
      const targets = cells.map((_, i) => ({ x: COLS[i % 4], y: ROWS[Math.floor(i / 4)] }));

      // Visual centre of a cell sits ~30px left / 25px up of its anchor; the grid's visual centre is (0, -60).
      const order = targets
        .map((t, i) => ({ i, d: Math.hypot(t.x - 30, t.y - 25 + 60) }))
        .sort((a, b) => a.d - b.d || a.i - b.i)
        .map((o) => o.i);

      // Fixed pseudo-random in [-1, 1] so the clutter is identical on every seek.
      const jitter = (i, k) => {
        const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
        return (s - Math.floor(s)) * 2 - 1;
      };

      const tl = gsap.timeline({ paused: true });

      const START_PROGRESS = 0.3;
      order.forEach((i, rank) => {
        const t = targets[i];
        tl.fromTo(
          cells[i],
          { x: t.x * START_PROGRESS, y: t.y * START_PROGRESS, scale: 0.6, opacity: 0, zIndex: i },
          { x: t.x, y: t.y, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" },
          CUE.there + rank * 0.07,
        );
      });

      tl.fromTo(
        urls,
        { y: -46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.035 },
        CUE.website - LEAD,
      );
      tl.fromTo(
        keys,
        { x: 34, scale: 0.85, opacity: 0, transformOrigin: "0% 50%" },
        { x: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.035 },
        CUE.key - LEAD,
      );
      tl.fromTo(
        receipts,
        { y: -44, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.035 },
        CUE.bill - LEAD,
      );

      const SQUEEZE = 0.88;
      cells.forEach((cell, i) => {
        const t = targets[i];
        tl.to(cell, { x: t.x * SQUEEZE, y: t.y * SQUEEZE, scale: 1.04, duration: 1.4, ease: "power2.inOut" }, CUE.using);
        tl.to(tiles[i], { rotation: jitter(i, 1) * 4, duration: 1.4, ease: "power2.inOut" }, CUE.using);
        tl.to(urls[i], { x: jitter(i, 2) * 10, rotation: jitter(i, 3) * 2.5, duration: 1.4, ease: "power2.inOut" }, CUE.using);
      });

      tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.03 }, CUE.using);

      cells.forEach((cell, i) => {
        const at = CUE.messy - LEAD + (i % 4) * 0.02;
        tl.to(tiles[i], { rotation: jitter(i, 1) * 7, x: jitter(i, 4) * 8, y: jitter(i, 5) * 6, duration: 0.4, ease: "power3.out" }, at);
        tl.to(urls[i], { x: jitter(i, 2) * 16, y: jitter(i, 6) * 8, rotation: jitter(i, 3) * 5, duration: 0.4, ease: "power3.out" }, at);
        tl.to(keys[i], { x: jitter(i, 7) * 20, y: jitter(i, 8) * 12, rotation: jitter(i, 9) * 8, duration: 0.4, ease: "power3.out" }, at);
        tl.to(receipts[i], { x: jitter(i, 10) * 16, y: jitter(i, 11) * 14, rotation: jitter(i, 12) * 10, duration: 0.4, ease: "power3.out" }, at);
      });

      tl.set({}, {}, 9.232);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-mess"] = tl;
