  <script>
    (() => {
      const ID = "01-mess";
      const root = document.querySelector('[data-composition-id="01-mess"]');
      const box = (el) => {
        let x = 0, y = 0;
        for (let n = el; n && n !== root; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
        return { x, y, w: el.offsetWidth, h: el.offsetHeight, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2 };
      };

      // The pile each row ends in, inside the list box less its top band (frame 02's lockup
      // lands there). tx/ty in -1..1 span the room the row has to move in that box, jx is a share
      // of the row's width, r its tilt. 02-one-door.html opens on this exact pile and holds a
      // copy; change both together.
      const PILE = {
        top: 0.2,
        rows: [
          [0.55, -0.7, 0, -2.5], [0.7, 0.1, 0, 2], [0.5, 0.7, 0, -1.5], [-0.92, -1, 0.01, -3.5],
          [-0.92, -0.14, -0.02, 4], [-0.92, 0.92, 0.02, -2], [-0.55, 0.4, -0.01, -3.5], [-0.55, -0.42, 0.02, 3],
        ],
      };
      const pileOf = (row, i, list) => {
        const b = box(row);
        const [tx, ty, jx, rotation] = PILE.rows[i];
        const h = list.h * (1 - PILE.top);
        const cy = list.y + list.h - h / 2;
        return {
          x: list.cx + (tx * (list.w - b.w)) / 2 + jx * b.w - b.cx,
          y: cy + (ty * (h - b.h)) / 2 - b.cy,
          rotation,
        };
      };

      // Word starts from 01-mess.words.json.
      const WORD = { there: 0.08, key: 2.52, bill: 3.74, use: 4.98, and: 5.3, keys: 6.06 };

      document.fonts.ready.then(() => {
        const list = box(root.querySelector(".list"));
        const rows = [...root.querySelectorAll(".row")];
        const part = (sel) => rows.map((row) => row.querySelector(sel));
        const tl = gsap.timeline({ paused: true });

        rows.forEach((row, i) => {
          tl.fromTo(row, { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, WORD.there + i * 0.11);
        });
        tl.fromTo(part(".k-key"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.03 }, WORD.key - 0.04);
        tl.fromTo(part(".bill"), { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.03 }, WORD.bill - 0.04);

        // "Use three": three rows are picked.
        tl.fromTo(root.querySelectorAll(".k-ring"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.1 }, WORD.use - 0.02);

        // "and you have three keys and three bills": the list loosens, then falls into the pile.
        const DRIFT = 0.35;
        rows.forEach((row, i) => {
          const end = pileOf(row, i, list);
          const mid = { x: end.x * DRIFT, y: end.y * DRIFT, rotation: end.rotation * DRIFT };
          tl.fromTo(row, { x: 0, y: 0, rotation: 0 }, { ...mid, duration: 0.7, ease: "power2.inOut", immediateRender: false }, WORD.and);
          tl.fromTo(row, mid, { ...end, duration: 0.6, ease: "power3.out", immediateRender: false }, WORD.keys - 0.06 + (i % 4) * 0.03);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
