  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (s) => document.getElementById("f07-" + s);

      // Word starts from .hyperframes/frame-packets/07-step-3-free.words.json.
      const W = { step: 0.03, use: 1.24, while: 3.35, pools: 5.08, no: 6.76, go: 8.05, noCost: 8.67, four: 9.66 };

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const enter = (el, t) => tl.fromTo(el, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, t);
        const rise = (el, t) => tl.fromTo(el, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
        const ringOn = (ring, t) => tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t + 0.15);
        const ringOff = (ring, t) => tl.to(ring, { opacity: 0, duration: 0.3, ease: "power2.out" }, t);

        // Step 3 of 3: use the free models
        tl.fromTo($("step"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.step);
        tl.fromTo($("step-name"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, W.use);
        rise($("while"), W.while);

        // the pool's free models, with no daily cap
        enter($("card-pool"), W.pools);
        ringOn($("ring-pool"), W.pools);
        rise($("cap"), W.no);

        // the Go plan at no cost
        enter($("card-go"), W.go);
        ringOff($("ring-pool"), W.go);
        ringOn($("ring-go"), W.go);
        rise($("no-cost"), W.noCost);

        // and $4 of credit every month
        enter($("card-credit"), W.four);
        ringOff($("ring-go"), W.four);
        ringOn($("ring-credit"), W.four);

        window.__timelines["07-step-3-free"] = tl;
      });
    })();
