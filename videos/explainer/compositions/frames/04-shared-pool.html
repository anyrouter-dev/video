        document.fonts.ready.then(() => {
          const tl = gsap.timeline({ paused: true });
          const enter = (target, from, at, duration = 0.6) =>

          enter(el("head"), { y: 24 }, 0.72);

          enter(el("field-key"), { y: 32 }, 1.78, 0.55);
          tl.fromTo(el("eq"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 2.52);

          tl.fromTo(el("pw-ring"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.9);

          tl.to(el("analogy"), { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 6.05);

            const to = box(el(`cell-${i}`));
            tl.to(pill, { x: to.cx - from.cx, y: to.cy - from.cy, scale: 0.4, duration: 0.42, ease: "power2.inOut" }, at - 0.42);
            tl.to(pill, { opacity: 0, duration: 0.24, ease: "power1.in" }, at - 0.24);

            tl.fromTo(el(`flash-${i}`), { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, at);
            tl.to(el(`flash-${i}`), { opacity: 0, duration: 0.8, ease: "power2.inOut" }, at + 0.12);
          });

          const table = box(el("browser"));
          const settle = box(el("settle"));
          tl.to(el("browser"), { x: settle.cx - table.cx, y: settle.cy - table.cy, duration: 0.6, ease: "power2.inOut" }, 9.1);

          [0, 1, 2].forEach((i) =>
            tl.fromTo(el(`free-${i}`), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 9.85 + i * 0.12),
          );

          window.__timelines[ID] = tl;
        });
      })();
    </script>
  </div>
</template>
