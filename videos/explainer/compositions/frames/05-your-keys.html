        K.rise(tl, dialog, 0.02, { y: 60, d: 0.7 });

        // "Claude": its company's row lights; "OpenAI?": the search finds it
        tl.fromTo($("anthropic"), { backgroundColor: ROW_OFF }, { backgroundColor: ROW_ON, duration: 0.25, immediateRender: false }, CLAUDE);
        const typed = [...$("typed").children];
        tl.set($("hint"), { opacity: 0 }, OPENAI);
        typed.forEach((c, i) => tl.set(c, { opacity: 1 }, OPENAI + i * 0.06));
        tl.to($("all"), { opacity: 0, duration: 0.2 }, OPENAI + 0.3);
        tl.fromTo($("found"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, OPENAI + 0.35);
        tl.fromTo($("openai"), { backgroundColor: ROW_OFF }, { backgroundColor: ROW_ON, duration: 0.25, immediateRender: false }, OPENAI + 0.6);

        // "Add your own key": OpenAI's key form, and the ring on Add key
        tl.to($("pick"), { opacity: 0, duration: 0.2 }, ADD);
        tl.to(dialog, { height: tall($("key")), duration: 0.5, ease: "power3.inOut" }, ADD);
        tl.fromTo($("key"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, ADD + 0.1);
        tl.fromTo($("ring"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, ADD + 0.55);

        // "at no markup"
        tl.set($("badge"), { xPercent: -50 }, 0);
        tl.fromTo($("badge"), { y: 30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, MARKUP);

        window.__timelines = window.__timelines || {};
        window.__timelines["05-your-keys"] = tl;
      });
    })();
  </script>
