          <circle id="03-power-strip-ring-app" cx="666.56" cy="479.01" r="0" fill="none" stroke="#0A0A0A" stroke-width="2" opacity="0" />
          <circle id="03-power-strip-ring-claude" cx="593.3" cy="432.12" r="0" fill="none" stroke="#0A0A0A" stroke-width="2" opacity="0" />
          <circle id="03-power-strip-ring-inlet" cx="629.93" cy="455.57" r="0" fill="none" stroke="#BB4D00" stroke-width="2.5" opacity="0" />
          <circle id="03-power-strip-ring-led1" cx="924.6" cy="335.6" r="0" fill="none" stroke="#007E55" stroke-width="2.5" opacity="0" />
          <circle id="03-power-strip-ring-led2" cx="1065.3" cy="280.7" r="0" fill="none" stroke="#007E55" stroke-width="2.5" opacity="0" />

            <circle cx="834.14" cy="300.54" r="17" fill="#C0262D" stroke="#FFFFFF" stroke-width="2.5" />
            <path d="M827.14 293.54L841.14 307.54M841.14 293.54L827.14 307.54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
          </g>
          <circle id="03-power-strip-dot-1" cx="651.37" cy="413.04" r="0" fill="#BB4D00" stroke="#FFFFFF" stroke-width="2.5" />
          <circle id="03-power-strip-dot-2" cx="651.37" cy="413.04" r="0" fill="#BB4D00" stroke="#FFFFFF" stroke-width="2.5" />

  <script>
    (() => {
      const ID = "03-power-strip";
      const root = document.querySelector('[data-composition-id="03-power-strip"]');
      const byId = (n) => document.getElementById(`${ID}-${n}`);
      const part = (sel) => root.querySelector(sel);
      const tl = gsap.timeline({ paused: true });

      const GREY = "#D4D4D8";
      const ORANGE = "#BB4D00";
      const GREEN = "#007E55";
      const GREEN_TINT = "#ECFDF5";
      const RED = "#C0262D";
      const PLUG_OUT = { x: -66.98, y: 26.17 };
      const DOT_R = 9;

      // Polylines from anchors.json (identical to #packet-path / #packet-path-2), sampled
      // here so the dot's motion is a fixed list of keyframes rather than a per-frame lookup.
      const PATH_1 = [[651.37, 413.04], [861.69, 330.87], [863.45, 323.71], [862.4, 323.04], [860.31, 317.29], [834.14, 300.54]];
      const PATH_2 = [[651.37, 413.04], [1002.36, 275.92], [1004.12, 268.76], [1003.07, 268.09], [1000.98, 262.34], [974.81, 245.59]];

      const pointAt = (pts, d) => {
        for (let i = 1; i < pts.length; i++) {
          const [x0, y0] = pts[i - 1];
          const [x1, y1] = pts[i];
          const seg = Math.hypot(x1 - x0, y1 - y0);
          if (d <= seg || i === pts.length - 1) {
            const t = Math.min(1, d / seg);
            return [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t];
          }
          d -= seg;
        }
      };
      const totalLength = (pts) =>
        pts.slice(1).reduce((sum, [x, y], i) => sum + Math.hypot(x - pts[i][0], y - pts[i][1]), 0);

      const travel = (dot, pts, start, duration) => {
        const STEPS = 40;
        const ease = gsap.parseEase("power2.inOut");
        const len = totalLength(pts);
        const samples = [];
        for (let k = 0; k <= STEPS; k++) samples.push(pointAt(pts, ease(k / STEPS) * len));
        for (let k = 0; k < STEPS; k++) {
          tl.fromTo(
            dot,
            { attr: { cx: samples[k][0], cy: samples[k][1] } },
            { attr: { cx: samples[k + 1][0], cy: samples[k + 1][1] }, duration: duration / STEPS, ease: "none", immediateRender: false },
            start + (k * duration) / STEPS,
          );
        }
      };

      const pop = (dot, at) =>
        tl.fromTo(dot, { attr: { r: 0 } }, { attr: { r: DOT_R }, duration: 0.22, ease: "power3.out", immediateRender: false }, at);

      const absorb = (dot, at) =>
        tl.fromTo(dot, { attr: { r: DOT_R } }, { attr: { r: 0 }, duration: 0.2, ease: "power2.in", immediateRender: false }, at);

      // Two steps (fade up, then grow + fade out) so a rewind lands on opacity 0, never a stale ring.
      const ripple = (ring, at, from, to, peak) => {
        tl.fromTo(ring, { attr: { r: from }, opacity: 0 }, { opacity: peak, duration: 0.06, ease: "none", immediateRender: false }, at);
        tl.fromTo(ring, { attr: { r: from }, opacity: peak }, { attr: { r: to }, opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, at + 0.06);
      };

      const recolor = (el, from, to, at, duration = 0.2) =>
        tl.fromTo(el, { fill: from }, { fill: to, duration, ease: "power1.out", immediateRender: false }, at);

      const cam = byId("cam");
      const leds = [1, 2, 3, 4].map((n) => part(`#led-${n}`));

      // Scene 1 — the strip rises in and settles on "power strip"; its light comes on at "AI".
      tl.fromTo(cam, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.88, ease: "power3.out" }, 0.2);
      tl.fromTo(cam, { scale: 1 }, { scale: 1.025, duration: 13.264 - 1.3, ease: "sine.inOut" }, 1.3);
      tl.fromTo(byId("label"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.08);
      recolor(part("#power-light"), GREY, ORANGE, 1.93);
      ripple(byId("ring-power"), 1.93, 8, 26, 0.5);

      // Scene 2 — plugs slide along the inlet axis and click home on "app" and "coding".
      tl.fromTo(part("#plug-app"), { x: PLUG_OUT.x, y: PLUG_OUT.y }, { x: 0, y: 0, duration: 0.38, ease: "power2.in" }, 2.67 - 0.38);
      ripple(byId("ring-app"), 2.67, 14, 46, 0.3);
      tl.fromTo(part("#plug-claude"), { x: PLUG_OUT.x, y: PLUG_OUT.y }, { x: 0, y: 0, duration: 0.38, ease: "power2.in" }, 3.36 - 0.38);
      ripple(byId("ring-claude"), 3.36, 14, 46, 0.3);
      ripple(byId("ring-inlet"), 4.97, 20, 80, 0.35);

      // Scene 3 — a request appears, every provider reports ready, the request runs to outlet 1.
      pop(byId("dot-1"), 7.43);
      leds.forEach((led, i) => recolor(led, GREY, GREEN, 7.99 + i * 0.1));
      travel(byId("dot-1"), PATH_1, 8.59, 0.78);
      absorb(byId("dot-1"), 9.37);
      ripple(byId("ring-led1"), 9.37, 8, 26, 0.5);

      // Scene 4 — outlet 1 fails; the next request passes it and lands on outlet 2.
      recolor(leds[0], GREEN, RED, 10.34, 0.15);
      tl.fromTo(byId("fault"), { opacity: 0, scale: 0.4, svgOrigin: "834.14 300.54" }, { opacity: 1, scale: 1, svgOrigin: "834.14 300.54", duration: 0.3, ease: "power3.out" }, 10.34);
      pop(byId("dot-2"), 10.71);
      travel(byId("dot-2"), PATH_2, 10.75, 0.65);
      absorb(byId("dot-2"), 11.4);
      recolor(leds[1], GREEN, GREEN_TINT, 11.4, 0.08);
      recolor(leds[1], GREEN_TINT, GREEN, 11.48, 0.3);
      ripple(byId("ring-led2"), 11.4, 8, 26, 0.5);
      tl.fromTo(byId("chip"), { opacity: 0, xPercent: -50, y: 14 }, { opacity: 1, xPercent: -50, y: 0, duration: 0.5, ease: "power3.out" }, 11.85);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
