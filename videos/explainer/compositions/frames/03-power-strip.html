        const box = (node) => {
          let x = 0, y = 0;
          for (let n = node; n && n !== root; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
          return { x, y, w: node.offsetWidth, h: node.offsetHeight, cx: x + node.offsetWidth / 2, cy: y + node.offsetHeight / 2 };
        };

        const IDLE = "#D4D4D8";
        const SOCKET = "#F5F5F5";
        const PLUGGED = "#3F3F46";
        const LINE = "#E5E5E5";
        const FREE = "#007E55";
        const DANGER = "#C0262D";

        // Cubic from the card's edge to the inlet: sideways when the strip sits beside
        // the cards (landscape), downward when it sits below them (portrait).
        const cableCurve = (card, inlet) => {
          const c = box(card);
          const p = box(inlet);
          if (p.x >= c.x + c.w) {
            const a = [c.x + c.w, c.cy], b = [p.x, p.cy], k = (b[0] - a[0]) / 2;
            return [a, [a[0] + k, a[1]], [b[0] - k, b[1]], b];
          }
          const a = [c.cx, c.y + c.h], b = [p.cx, p.y], k = (b[1] - a[1]) / 2;
          return [a, [a[0], a[1] + k], [b[0], b[1] - k], b];
        };
        const onCurve = ([p0, p1, p2, p3], t) =>
          [0, 1].map((i) => (1 - t) ** 3 * p0[i] + 3 * (1 - t) ** 2 * t * p1[i] + 3 * (1 - t) * t ** 2 * p2[i] + t ** 3 * p3[i]);

        // n + 1 points along a polyline, spaced by distance through `ease`.
        const along = (pts, n, ease) => {
          const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
          const total = seg.reduce((sum, v) => sum + v, 0);
          return Array.from({ length: n + 1 }, (_, k) => {
            let dist = ease(k / n) * total;
            let i = 0;
            while (i < seg.length - 1 && dist > seg[i]) { dist -= seg[i]; i++; }
            const t = seg[i] ? Math.min(1, dist / seg[i]) : 0;
            return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t];
          });
        };

        document.fonts.ready.then(() => {
          el("wires").setAttribute("viewBox", `0 0 ${root.offsetWidth} ${root.offsetHeight}`);

          const tl = gsap.timeline({ paused: true });
          const enter = (target, from, at, duration = 0.6) =>
            tl.fromTo(target, { opacity: 0, ...from }, { opacity: 1, x: 0, y: 0, duration, ease: "power3.out" }, at);
          const change = (target, from, to, at, duration, ease = "power2.out") =>
            tl.fromTo(target, from, { ...to, duration, ease, immediateRender: false }, at);

          enter(el("strip"), { y: 40 }, 0.62, 0.7);
          [0, 1, 2, 3].forEach((i) => enter(el(`socket-${i}`), { y: 24 }, 1.5 + i * 0.08, 0.5));

          const plugIn = (name, at, click) => {
            const curve = cableCurve(el(`plug-${name}`), el(`inlet-${name}`));
            const cable = el(`cable-${name}`);
            cable.setAttribute("d", `M${curve[0]} C${curve[1]} ${curve[2]} ${curve[3]}`);
            enter(el(`plug-${name}`), { x: -40 }, at, 0.35);
            tl.fromTo(cable, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, at + 0.08);
            tl.fromTo(cable, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: click - at - 0.08, ease: "power2.in" }, at + 0.08);
            tl.fromTo(el(`inlet-${name}`), { backgroundColor: SOCKET, borderColor: IDLE }, { backgroundColor: PLUGGED, borderColor: PLUGGED, duration: 0.12, ease: "power2.out" }, click);
            tl.fromTo(el(`ripple-${name}`), { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, click);
            return curve;
          };
          const appCurve = plugIn("app", 1.98, 2.31);
          plugIn("cli", 3.05, 3.56);

          tl.fromTo(el("strip-ring"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 4.77);
          change(el("strip-ring"), { opacity: 1 }, { opacity: 0 }, 6.9, 0.3);

          const pulse = el("pulse");
          const inlet = box(el("inlet-app"));
          const s0 = box(el("socket-0"));
          const s1 = box(el("socket-1"));
          const route = [...Array.from({ length: 33 }, (_, k) => onCurve(appCurve, k / 32)), [inlet.cx, inlet.cy], [s0.cx, s0.cy]];
          const STEPS = 40;
          const pts = along(route, STEPS, gsap.parseEase("power2.inOut"));
          const [leave, arrive] = [7.25, 8.89];
          gsap.set(pulse, { x: pts[0][0], y: pts[0][1] });
          tl.fromTo(pulse, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "power3.out" }, 7.08);
          pts.slice(1).forEach((p, k) =>
            change(pulse, { x: pts[k][0], y: pts[k][1] }, { x: p[0], y: p[1] }, leave + (k * (arrive - leave)) / STEPS, (arrive - leave) / STEPS, "none"),
          );
          change(pulse, { scale: 1, opacity: 1 }, { scale: 0.3, opacity: 0 }, arrive, 0.2, "power2.in");

          const ready = (i, at) => {
            change(el(`led-${i}`), { backgroundColor: IDLE }, { backgroundColor: FREE }, at, 0.2);
            tl.fromTo(el(`ring-${i}`), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
          };
          ready(0, arrive);

          const down = 10.05;
          change(el("led-0"), { backgroundColor: FREE }, { backgroundColor: DANGER }, down, 0.15);
          change(el("socket-0"), { borderColor: LINE }, { borderColor: DANGER }, down, 0.2);
          change(el("face-0"), { opacity: 1 }, { opacity: 0.35 }, down, 0.3);
          change(el("ring-0"), { opacity: 1 }, { opacity: 0 }, down, 0.2);
          enter(el("down-0"), { y: 12 }, down, 0.3);

          const [retry, served] = [10.56, 10.86];
          change(pulse, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1 }, retry, 0.12, "power3.out");
          change(pulse, { x: s0.cx, y: s0.cy }, { x: s1.cx, y: s1.cy }, retry + 0.02, served - retry - 0.02, "power2.inOut");
          change(pulse, { scale: 1, opacity: 1 }, { scale: 0.3, opacity: 0 }, served, 0.2, "power2.in");
          ready(1, served);

          enter(el("failover"), { y: 12 }, 11.03, 0.4);

          window.__timelines[ID] = tl;
        });
      })();
    </script>
  </div>
</template>
