  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById("05-step-1-key-" + id);
      const tl = gsap.timeline({ paused: true });

      // Canvas points (cursor hot spot targets), derived from the fixed layout above.
      const SIGN_UP = { x: 1751, y: 270.7 };
      const CREATE = { x: 1645.5, y: 409.5 };
      const M_CREATE = { x: 1418.5, y: 799.5 };
      const COPY = { x: 1423.5, y: 671.5 };
      const PILL_SLOT = { x: 1129.5, y: 671.5 };
      const PILL_OUT = { x: 1500, y: 470 };
      const CLICK_CREATE = 10.84;
      const CLICK_M_CREATE = 11.34;
      const CLICK_COPY = 11.77;
      const at = (p) => ({ x: p.x - 2, y: p.y - 2 });
      const press = (el, target, t) => {
        tl.to($("cursor"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, t);
        tl.to($("cursor"), { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
        tl.to(target, { scale: 0.95, duration: 0.06, ease: "power2.in" }, t);
        tl.to(target, { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
        tl.fromTo(el, { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
      };

      gsap.set($("cursor"), { transformOrigin: "2px 2px" });
      gsap.set($("pill"), { xPercent: -50, yPercent: -50 });

      // Scene 0 — free on sign-up vs the whole pool, then the cards clear for the steps
      tl.fromTo($("card-a"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.11);
      tl.fromTo($("chip-a"), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.83);
      tl.fromTo($("card-b"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.59);
      tl.fromTo($("chip-b"), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.64);
      tl.to([$("card-a"), $("card-b")], { y: -24, opacity: 0, duration: 0.35, ease: "power2.in" }, 5.3);

      // Scene 1 — rail draws on in one stagger, headline rises
      tl.fromTo([$("c1"), $("c2"), $("c3")], { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 5.49);
      tl.fromTo([$("l1"), $("l2"), $("l3")], { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 5.55);
      tl.fromTo([$("h1"), $("h2")], { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut", stagger: 0.08 }, 5.6);
      tl.fromTo($("c1-on"), { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 5.68);
      tl.set($("c1-todo"), { opacity: 0 }, 6.03);
      tl.fromTo($("l1-on"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.68);
      tl.fromTo([$("w1"), $("w2"), $("w3")], { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.1 }, 5.75);

      // Scene 2 — real openrouter.ai, then cross-cut to the Keys page on "keys"
      tl.fromTo($("browser"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 6.53);
      tl.fromTo($("shot"), { scale: 1 }, { scale: 1.03, duration: 3.0, ease: "none" }, 6.6);
      tl.fromTo($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 7.27);
      tl.fromTo($("cursor"), { x: 1558, y: 818 }, { ...at(SIGN_UP), duration: 0.8, ease: "power2.inOut" }, 7.27);
      tl.fromTo($("strip"), { x: 0 }, { x: -1187, duration: 0.55, ease: "power3.inOut" }, 9.4);
      tl.to($("url-home"), { opacity: 0, duration: 0.2, ease: "power2.out" }, 9.57);
      tl.fromTo($("url-keys"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 9.57);
      tl.to($("cursor"), { x: 1398, y: 558, duration: 0.6, ease: "power2.inOut" }, 9.35);

      // Scene 3 — Create Key opens the modal; Create swaps it to the new key
      tl.to($("cursor"), { ...at(CREATE), duration: 0.6, ease: "power3.out" }, 10.2);
      press($("ripple-create"), $("create"), CLICK_CREATE);
      tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 10.92);
      tl.to([$("empty"), $("thead")], { opacity: 0, duration: 0.15, ease: "power2.out" }, 10.92);
      tl.fromTo($("modal"), { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "power3.out" }, 10.92);
      tl.to($("cursor"), { ...at(M_CREATE), duration: 0.32, ease: "power2.inOut" }, 11.0);
      press($("ripple-m-create"), $("m-create"), CLICK_M_CREATE);
      tl.to($("form"), { opacity: 0, duration: 0.1, ease: "power2.out" }, 11.4);
      tl.fromTo($("done"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 11.5);
      tl.fromTo($("pill"), { x: PILL_SLOT.x, y: PILL_SLOT.y + 8, opacity: 0 }, { x: PILL_SLOT.x, y: PILL_SLOT.y, opacity: 1, duration: 0.25, ease: "power3.out" }, 11.5);

      // Scene 4 — Copy, toast, the modal closes and the key lifts out for Frame 6
      tl.to($("cursor"), { ...at(COPY), duration: 0.24, ease: "power2.inOut" }, 11.5);
      press($("ripple-copy"), $("copy"), CLICK_COPY);
      tl.fromTo($("toast"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 11.82);
      tl.fromTo($("glyph-on"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 11.85);
      tl.to([$("modal"), $("scrim")], { opacity: 0, duration: 0.25, ease: "power2.out" }, 12.15);
      tl.to($("browser"), { opacity: 0.35, duration: 0.4, ease: "power2.out" }, 12.2);
      tl.to($("pill"), { x: PILL_OUT.x, y: PILL_OUT.y, duration: 0.5, ease: "power2.inOut" }, 12.15);
      tl.to($("thead"), { opacity: 1, duration: 0.2, ease: "power2.out" }, 12.65);
      tl.fromTo($("row"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 12.65);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-step-1-key"] = tl;
    })();
  </script>
