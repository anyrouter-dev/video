  <script>
    (function () {
      const ID = "05-step-1-key";
      const $ = (id) => document.getElementById(`${ID}-${id}`);
      const stage = $("stage");

      // Layout box relative to the stage, ignoring transforms (tools/shared-components.md).
      const box = (el) => {
        let x = 0, y = 0;
        for (let n = el; n && n !== stage; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
        return { x, y, w: el.offsetWidth, h: el.offsetHeight, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2 };

      // Word starts from .hyperframes/frame-packets/05-step-1-key.words.json.
      const W = {
        some: 0.05, work: 1.02, to: 3.0, share: 4.66, step: 6.71, one: 6.77, sign: 7.11,
        openrouter: 7.84, open: 9.34, keys: 9.41, create: 10.54, copy: 11.73, it: 11.87,
      };
      const CLICK_CREATE = W.create;
      const CLICK_M_CREATE = W.create + 0.5;
      const CLICK_COPY = W.copy;

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        gsap.set([$("url-keys"), $("done")], { opacity: 0 });
        gsap.set($("copied"), { y: 10, opacity: 0 });

        // The keys panel sits one view to the right of the home panel; the modal is centred in it.
        // Points are measured with the strip at rest, then shifted by one panel for the keys page.
        const view = box($("strip"));
        const getkey = box($("getkey"));
        const shift = (b) => ({ ...b, cx: b.cx - view.w });
        const create = shift(box($("create")));
        const mCreate = shift(box($("m-create")));
        const copy = shift(box($("copy")));
        const hot = (p) => ({ x: p.cx - 3, y: p.cy - 3 });
        const enter = { x: view.x + view.w * 0.82, y: view.y + view.h + 40 };

        const press = (target, ripple, p, t) => {
          tl.to($("cursor"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, t);
          tl.to($("cursor"), { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
          tl.to(target, { scale: 0.96, duration: 0.06, ease: "power2.in" }, t);
          tl.to(target, { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
          tl.set(ripple, { x: p.cx, y: p.cy }, t);
          tl.fromTo(ripple, { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
        };

        // Free models on sign-up, then the whole pool for one shared key
        tl.fromTo($("card-a"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, W.some);
        tl.fromTo($("chip-a"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.work);
        tl.fromTo($("card-b"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, W.to);
        tl.fromTo($("chip-b"), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, W.share);
