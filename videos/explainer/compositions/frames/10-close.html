    (function () {
      const $ = (s) => document.getElementById("f10-" + s);
      // Word starts from 10-close.words.json; the mark lands on the sparkle cue ("Start" + 0.1s).
      const ONE = 0.01, POOL = 1.5, START = 3.48, SPARKLE = 3.575, URL = 3.87;

      const tl = gsap.timeline({ paused: true });
      const rise = (el, t) => tl.fromTo(el, { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, t);

      rise($("l2"), POOL);
      tl.to($("lines"), { y: -24, opacity: 0, duration: 0.25, ease: "power2.out" }, START);

      tl.fromTo($("mark"), { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, SPARKLE);
      rise($("word"), SPARKLE + 0.08);
      rise($("url"), URL);

      window.__timelines = window.__timelines || {};
      window.__timelines["10-close"] = tl;
