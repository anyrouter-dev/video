      const T_SIGN = 0.96, T_ANYROUTER = 1.44, T_OPEN = 2.96;
      const T_CLICK = 4.85, T_NEXT = 5.56, T_OPENROUTER = 5.82;
      const T_PASTE = 6.89, T_YOUR = 7.52;
      const T_PRESS = 9.15, T_DONATE_BTN = 9.68, T_SUCCESS = 10.5;
      const T_ENCRYPTED = 11.29, T_TIME_END = 12.55;
      const T_NVIDIA = 13.38, T_WORKS = 13.97, T_SAME = 14.42, T_WAY = 14.72;
      const DURATION = 15.696;

      // Sign-in capture: push in from the page onto the "Continue to AnyRouter" dialog.
      // Image offset = view centre - scale * source point, so the source point sits at the centre.
      const SIGNIN_VIEW = { x: 220, y: 212, cx: 525, cy: 329 };
      const SIGNIN_FROM = { s: 0.5, x: 1918, y: 658 };
      const SIGNIN_TO = { s: 0.68, x: 1918, y: 580 };
      const signinPose = (p) => ({ scale: p.s, x: SIGNIN_VIEW.cx - p.s * p.x, y: SIGNIN_VIEW.cy - p.s * p.y });
      const signinPoint = (sx, sy) => ({
        x: SIGNIN_VIEW.x + SIGNIN_VIEW.cx + SIGNIN_TO.s * (sx - SIGNIN_TO.x),
        y: SIGNIN_VIEW.y + SIGNIN_VIEW.cy + SIGNIN_TO.s * (sy - SIGNIN_TO.y),
      });
      const GITHUB_BTN = signinPoint(1920, 462);

      // Donate slice at 1.2 from source (2830, 600), placed at x 708 of the card's view, which starts at (480, 272).
      const donatePoint = (sx, sy) => ({ x: 480 + 708 + 1.2 * (sx - 2830), y: 272 + 1.2 * (sy - 600) });
      const ROW_DONATE = donatePoint(2925, 716);

      // Dialog is authored at 640px and shown at 1.5x from its top-left (480, 290).
      const DLG_SCALE = 1.5;
      const dlg = (lx, ly) => ({ x: 480 + DLG_SCALE * lx, y: 290 + DLG_SCALE * ly });
      const INPUT_TEXT = dlg(44 + 126, 113);
      const DONATE_BTN = dlg(528, 230);

      // Parked clear of both browser cards (sign-in ends at x 1270, the pool card at x 1440).
      const PARK = { x: 1640, y: 240 };

      gsap.set(q("dlg-outer"), { scale: DLG_SCALE });
      gsap.set(q("pill"), { xPercent: -50, yPercent: -50 });
      gsap.set([q("ripple1"), q("ripple2"), q("ripple0")], { xPercent: -50, yPercent: -50 });
      gsap.set(q("input-text"), { transformOrigin: "0% 50%" });

      // Handoff from Frame 5: key pill at (1500, 470), drifting left, then parks top-right.
      tl.fromTo(q("pill"), { x: 1500, y: 470, scale: 1, opacity: 1 }, { x: 1480, duration: 0.3, ease: "power2.out" }, 0);
      tl.to(q("pill"), { y: PARK.y, scale: 0.72, duration: 0.75, ease: "power2.out" }, 0.3);
      tl.to(q("pill"), { x: PARK.x, duration: 0.85, ease: MOVE }, 0.35);

      tl.fromTo(q("signin"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: IN }, 0.1);
      tl.fromTo(q("signin-shot"), signinPose(SIGNIN_FROM), { ...signinPose(SIGNIN_TO), duration: 1.2, ease: "power3.inOut" }, T_SIGN);

      // Cursor: hot spot is the path tip at (2, 2).
      const at = (p) => ({ x: p.x - 2, y: p.y - 2 });
      const click = (t, p, ring) => {
        tl.to(q("cursor"), { scale: 0.88, duration: 0.12, ease: "power2.in" }, t);
        tl.to(q("cursor"), { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.12);
        tl.fromTo(q(ring), { x: p.x, y: p.y, scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
      };
      tl.fromTo(q("cursor"), { x: 1150, y: 800, opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, T_ANYROUTER);
      tl.to(q("cursor"), { ...at(GITHUB_BTN), duration: 0.6, ease: IN }, T_ANYROUTER + 0.05);
      click(2.2, GITHUB_BTN, "ripple0");

      // Hard cut to the pool page on "open".
      tl.set(q("signin"), { opacity: 0 }, T_OPEN);
      tl.fromTo(q("card"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: IN }, T_OPEN);

      tl.to(q("cursor"), { ...at(ROW_DONATE), duration: 0.6, ease: MOVE }, T_CLICK);
      tl.fromTo(q("row-tint"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, T_NEXT);
      click(T_OPENROUTER, ROW_DONATE, "ripple1");

      tl.fromTo(q("veil"), { opacity: 0 }, { opacity: 0.4, duration: 0.4, ease: "none" }, T_OPENROUTER + 0.15);
      tl.to(q("row-tint"), { opacity: 0, duration: 0.3, ease: "none" }, T_OPENROUTER + 0.15);
      tl.fromTo(q("dlg"), { y: 50, scale: 0.96, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.6, ease: IN }, T_OPENROUTER + 0.2);
      tl.to(q("cursor"), { x: 1440, y: 770, duration: 0.7, ease: MOVE }, T_OPENROUTER + 0.4);

      // Paste: the parked key flies into the input and becomes its value.
      tl.fromTo(q("input-focus"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, T_PASTE);
      tl.to(q("pill"), { x: INPUT_TEXT.x, y: INPUT_TEXT.y, scale: 1.05, duration: T_YOUR - T_PASTE, ease: "power3.inOut" }, T_PASTE);
      tl.to(q("pill"), { opacity: 0, duration: 0.15, ease: "none" }, T_YOUR);
      tl.fromTo(q("input-text"), { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.25, ease: IN }, T_YOUR);

      tl.to(q("cursor"), { ...at(DONATE_BTN), duration: 0.45, ease: IN }, T_PRESS);
      click(T_DONATE_BTN, DONATE_BTN, "ripple2");
      tl.fromTo(q("donate"), { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.in" }, T_DONATE_BTN);
      tl.to(q("donate"), { scale: 1, duration: 0.12, ease: "power2.out" }, T_DONATE_BTN + 0.12);
      tl.fromTo(q("checking-label"), { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, T_DONATE_BTN + 0.06);
      tl.fromTo(q("donate-label"), { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "none" }, T_DONATE_BTN + 0.06);

      tl.to(q("form"), { opacity: 0, y: -10, duration: 0.2, ease: "power2.in" }, T_SUCCESS - 0.06);
      tl.fromTo(q("done"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, T_SUCCESS + 0.08);
      tl.to(q("cursor"), { x: 1500, y: 790, opacity: 0, duration: 0.5, ease: MOVE }, T_SUCCESS);

      tl.fromTo(q("dot2"), { scale: 1 }, { scale: 1.12, duration: 0.2, ease: "power2.out" }, T_SUCCESS);
      tl.to(q("dot2"), { scale: 1, duration: 0.3, ease: MOVE }, T_SUCCESS + 0.2);
      tl.fromTo(q("done2"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: IN }, T_SUCCESS);
      tl.fromTo(q("num2"), { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "none" }, T_SUCCESS);
      tl.fromTo(q("label2-active"), { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "none" }, T_SUCCESS);
      tl.fromTo(q("label2-done"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "none" }, T_SUCCESS);

      tl.fromTo(q("safe"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: IN }, T_ENCRYPTED);
      tl.fromTo(q("safe2"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: IN }, T_ENCRYPTED + 0.4);

      // NVIDIA aside: the success card settles left in the pause after "time" (ends right edge x 1056),
      // then NVIDIA's card enters with its heading, so no empty shell ever shows, and holds to the end.
      tl.to(q("veil"), { opacity: 0, duration: 0.5, ease: "none" }, T_TIME_END);
      tl.to(q("card"), { opacity: 0, duration: 0.5, ease: "none" }, T_TIME_END);
      tl.fromTo(q("dlg-outer"), { x: 0, y: 0, scale: DLG_SCALE }, { x: -256, y: 28, scale: 1.3, duration: 0.7, ease: MOVE, immediateRender: false }, T_TIME_END);
      tl.fromTo(q("nv"), { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: IN }, T_TIME_END + 0.7);
      tl.fromTo(q("nv-head"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, T_TIME_END + 0.7);
      tl.fromTo(q("nv-path"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: IN }, T_NVIDIA + 0.25);
      tl.fromTo(q("nv-pill"), { x: 40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: IN }, T_WORKS);
      tl.fromTo(q("nv-btn"), { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: IN }, T_SAME);

      tl.fromTo(q("active3"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: IN }, T_WAY);
      tl.set(q("todo3"), { opacity: 0 }, T_WAY + 0.3);
      tl.fromTo(q("label3-todo"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, T_WAY);
      tl.fromTo(q("label3-active"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, T_WAY);

      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-step-2-donate"] = tl;
    })();
  </script>
</template>
