  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const $ = (s) => document.getElementById("f06-" + s);
      const stage = $("stage");

      // Layout box relative to the stage, ignoring transforms (tools/shared-components.md).
      const box = (el) => {
        let x = 0, y = 0;
        for (let n = el; n && n !== stage; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
        return { x, y, w: el.offsetWidth, h: el.offsetHeight, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2 };
      };

      // Word starts from .hyperframes/frame-packets/06-step-2-donate.words.json.
      const W = {
        step: 0.03, two: 0.38, sign: 1.13, anyrouter: 1.66, shared: 3.97, click: 5.46, next: 5.97,
        openrouter: 6.57, paste: 7.5, your: 7.76, press: 8.57, donate: 8.97, encrypts: 10.93,
        stop: 12.76, nvidia: 15.06, works: 15.69,
      };
      // sfx-cues.json: the sign-in click is anyrouter.dev + 0.76, the success chime is Donate + 0.82
      const CLICK_GITHUB = W.anyrouter + 0.76;
      const SUCCESS = W.donate + 0.82;

      // Captured px in the 3840x2160 screenshots.
      const GITHUB = { x0: 1596, y0: 428, x1: 2244, y1: 496, r: 12 };   // "Continue with GitHub"
      const SIGNIN_FOCUS = { y0: 160, y1: 520 };                       // the dialog's close button down past the GitHub button
      const POOL = { y0: 590, y1: 944 };                               // table header to the Google AI Studio row
      const OPENROUTER_ROW = { y0: 672, y1: 759 };
      const ROW_DONATE = { x0: 2854, y0: 688, x1: 3002, y1: 744, r: 12 };

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });

        // Sign-in capture: the GitHub button centred, as large as the view allows (at most 1.5).
        const sv = box($("signin"));
        const ss = Math.min(1.5, sv.w / (GITHUB.x1 - GITHUB.x0 + 40), sv.h / (SIGNIN_FOCUS.y1 - SIGNIN_FOCUS.y0));
        const sx = (GITHUB.x0 + GITHUB.x1) / 2 - sv.w / 2 / ss;
        const sy = (SIGNIN_FOCUS.y0 + SIGNIN_FOCUS.y1) / 2 - sv.h / 2 / ss;
        gsap.set($("signin-img"), { width: 3840 * ss, x: -sx * ss, y: -sy * ss });
        gsap.set($("github"), { left: (GITHUB.x0 - sx) * ss, top: (GITHUB.y0 - sy) * ss, width: (GITHUB.x1 - GITHUB.x0) * ss, height: (GITHUB.y1 - GITHUB.y0) * ss, borderRadius: GITHUB.r * ss });
        gsap.set($("github-ring"), { borderRadius: GITHUB.r * ss + 10 });

        // Pool capture: abutting column slices (Provider, Keys, Donate; Keys is hidden in portrait).
        const slices = [...$("table").querySelectorAll(".slice")].filter((el) => getComputedStyle(el).display !== "none");
        const span = (el) => el.dataset.x1 - el.dataset.x0;
        const pv = box($("pool"));
        const ps = Math.min(1.5, pv.h / (POOL.y1 - POOL.y0), pv.w / slices.reduce((sum, el) => sum + span(el), 0));
        for (const el of slices) {
          gsap.set(el, { width: span(el) * ps, height: (POOL.y1 - POOL.y0) * ps });
          gsap.set(el.querySelector("img"), { width: 3840 * ps, x: -el.dataset.x0 * ps, y: -POOL.y0 * ps });
        }
        const donateSlice = $("row-donate").parentElement;
        gsap.set($("row-donate"), { left: (ROW_DONATE.x0 - donateSlice.dataset.x0) * ps, top: (ROW_DONATE.y0 - POOL.y0) * ps, width: (ROW_DONATE.x1 - ROW_DONATE.x0) * ps, height: (ROW_DONATE.y1 - ROW_DONATE.y0) * ps, borderRadius: ROW_DONATE.r * ps });
        gsap.set($("row-ring"), { borderRadius: ROW_DONATE.r * ps + 10 });
        gsap.set($("row-tint"), { top: (OPENROUTER_ROW.y0 - POOL.y0) * ps, height: (OPENROUTER_ROW.y1 - OPENROUTER_ROW.y0) * ps });

        // Cursor targets (the arrow's hot spot is 3px into its box).
        const hot = (el, fx, fy) => { const b = box(el); return { x: b.x + b.w * fx - 3, y: b.y + b.h * fy - 3 }; };
        const atGithub = hot($("github"), 0.82, 0.55);
        const atRow = hot($("row-donate"), 0.74, 0.7);
        const atField = hot($("field"), 0.86, 0.6);
        const atDonate = hot($("donate"), 0.9, 0.72);
        const enter = { x: sv.x + sv.w * 0.78, y: sv.y + sv.h + 40 };

        const press = (ripple, p, t) => {
          tl.to($("cursor"), { scale: 0.88, duration: 0.06, ease: "power2.in" }, t);
          tl.to($("cursor"), { scale: 1, duration: 0.08, ease: "power2.out" }, t + 0.06);
          tl.set(ripple, { x: p.x + 3, y: p.y + 3 }, t);
          tl.fromTo(ripple, { scale: 0, opacity: 0.5 }, { scale: 1, opacity: 0, duration: 0.45, ease: "power2.out" }, t);
        };
        const ringOn = (ring, t) => tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);

        // Step 2 of 3
        tl.fromTo($("step"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, W.step);
        tl.fromTo($("step-name"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, W.two);

        // Sign in at anyrouter.dev
        tl.fromTo($("browser"), { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, W.sign);
        tl.fromTo($("cursor"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, W.anyrouter);
        tl.fromTo($("cursor"), { ...enter }, { ...atGithub, duration: 0.65, ease: "power2.inOut" }, W.anyrouter);
        ringOn($("github-ring"), CLICK_GITHUB);
        press($("ripple-a"), atGithub, CLICK_GITHUB);

        // …and open the Shared pool
        tl.fromTo($("pool"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, W.shared);
