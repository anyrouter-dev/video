        const b = box(row);
        const [tx, ty, jx, rotation] = PILE.rows[i];
        const h = list.h * (1 - PILE.top);
        const cy = list.y + list.h - h / 2;
        return {
          x: list.cx + (tx * (list.w - b.w)) / 2 + jx * b.w - b.cx,
          y: cy + (ty * (h - b.h)) / 2 - b.cy,
          rotation,
        };
      };

      // Word starts from 02-one-door.words.json.
      const WORD = { anyrouter: 0.05, gives: 0.56, account: 1.24, key: 2.11, n260: 3.0, models: 3.61 };

      document.fonts.ready.then(() => {
        const list = box(root.querySelector(".list"));
        const rows = [...root.querySelectorAll(".row")];
        const [account, key, count] = root.querySelectorAll(".card");
        const num = root.querySelector(".num");
        num.style.width = `${num.offsetWidth}px`;
        num.textContent = "0";
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(root.querySelector(".lockup"), { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, WORD.anyrouter);

        // The rows leave the pile nearest-first and land in the mark by "gives".
        const mark = box(root.querySelector(".mark"));
        const flights = rows
          .map((row, i) => ({ row, from: pileOf(row, i, list), b: box(row) }))
          .sort((a, b) => Math.hypot(a.b.cx + a.from.x - mark.cx, a.b.cy + a.from.y - mark.cy) - Math.hypot(b.b.cx + b.from.x - mark.cx, b.b.cy + b.from.y - mark.cy));
        flights.forEach(({ row, from, b }, k) => {
          const at = WORD.gives - 0.48 + k * 0.05;
          tl.fromTo(row, { ...from, scale: 1 }, { x: mark.cx - b.cx, y: mark.cy - b.cy, rotation: 0, scale: 0.1, duration: 0.5, ease: "power2.inOut" }, at);
          tl.fromTo(row, { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power1.in" }, at + 0.15);
        });

        const enter = (el, at) => tl.fromTo(el, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
        enter(account, WORD.account - 0.06);
        enter(key, WORD.key - 0.06);
        enter(count, WORD.n260 - 0.1);

        const state = { value: 0 };
        tl.fromTo(state, { value: 0 }, { value: 260, duration: 0.55, ease: "power2.out", onUpdate: () => (num.textContent = String(Math.round(state.value))) }, WORD.n260);
        tl.fromTo(root.querySelectorAll(".plus, .models"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, WORD.models - 0.03);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      });
    })();
  </script>
</template>
