            <path d="M5600 9175 c0 -3 22 -40 48 -83 64 -101 327 -522 428 -684 l79 -127 970 -3 970 -3 73 -23 c258 -79 443 -233 566 -471 67 -129 97 -253 97 -401 0 -128 -8 -184 -46 -297 -92 -276 -338 -507 -622 -585 -72 -19 -108 -21 -480 -25 -222 -3 -403 -7 -403 -9 0 -2 50 -84 112 -182 128 -205 258 -410 513 -817 100 -159 250 -398 334 -530 83 -132 283 -450 443 -707 l293 -467 538 -1 c295 0 537 2 537 5 0 2 -52 89 -116 192 -64 103 -129 208 -144 233 -23 38 -318 510 -877 1402 -67 108 -123 201 -123 205 1 4 37 30 81 56 182 110 396 310 528 495 140 197 250 446 301 687 31 142 39 438 16 590 -61 405 -251 768 -554 1056 -135 129 -260 215 -437 304 -220 109 -400 162 -634 185 -105 10 -2491 15 -2491 5z"/>

  <script>
    (() => {
      const ID = "02-one-door";
      const byId = (n) => document.getElementById(`${ID}-${n}`);
      const stage = byId("stage");
      const spokes = byId("spokes");
      const tl = gsap.timeline({ paused: true });

      const PROVIDERS = [
        ["openai", "openai.com"], ["anthropic", "anthropic.com"], ["google", "ai.google.dev"], ["deepseek", "deepseek.com"],
        ["mistral", "mistral.ai"], ["xai", "x.ai"], ["qwen", "qwen.ai"], ["meta", "ai.meta.com"],
        ["moonshotai", "moonshot.ai"], ["nvidia", "build.nvidia.com"], ["openrouter", "openrouter.ai"], ["groq", "groq.com"],
      ];
      const KEY_HTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="16.5" r="4.5"/><path d="M10.7 13.3 20.5 3.5M17 7l3 3M14.5 9.5l2 2"/></svg><span>sk-••••</span>';
      const RECEIPT_HTML = '<svg viewBox="0 0 60 74" fill="none"><path d="M2 5Q2 2 5 2H55Q58 2 58 5V71L51 65L44 71L37 65L30 71L23 65L16 71L9 65L2 71Z" fill="#FAFAFA" stroke="#D4D4D8" stroke-width="1.5" stroke-linejoin="round"/><rect x="14" y="42" width="32" height="4" rx="2" fill="#D4D4D8"/><rect x="14" y="51" width="20" height="4" rx="2" fill="#D4D4D8"/></svg><span>$</span>';

      // Handoff: Frame 1's final values (01-mess.html), so the hard cut shows the same picture.
      const COLS = [-538, -158, 222, 602], ROWS = [-280, -30, 220], SQUEEZE = 0.88, CELL_SCALE = 1.04;
      const jitter = (i, k) => {
        const s = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453;
        return (s - Math.floor(s)) * 2 - 1;
      };
      // Tile centre in cell space (left -130 / top -100, 120px wide).
      const TILE_CX = -70, TILE_CY = -40;
      // Ring and hub share one centre so spokes terminate under the hub disc.
      const C = { x: 960, y: 400 }, RX = 660, RY = 320, RING_SCALE = 103 / 120;

      const grid = byId("grid");
      const tiles = PROVIDERS.map(([name, domain], i) => {
        const cell = document.createElement("div");
        cell.className = `${ID}-cell`;
        const part = (cls, html) => {
          const el = document.createElement("div");
          el.className = `${ID}-${cls}`;
          el.innerHTML = html;
          cell.appendChild(el);
          return el;
        };
        const url = part("url", "<span></span>");
        url.firstChild.textContent = domain;
        const tile = part("tile", "");
        const img = document.createElement("img");
        img.src = `assets/provider-${name}.svg`;
        img.alt = "";
        tile.appendChild(img);
        const key = part("apikey", KEY_HTML);
        const receipt = part("receipt", RECEIPT_HTML);
        grid.appendChild(cell);

        const end = {
          cell: { x: COLS[i % 4] * SQUEEZE, y: ROWS[Math.floor(i / 4)] * SQUEEZE, scale: CELL_SCALE, zIndex: i },
          tile: { x: jitter(i, 4) * 8, y: jitter(i, 5) * 6, rotation: jitter(i, 1) * 7 },
          url: { x: jitter(i, 2) * 16, y: jitter(i, 6) * 8, rotation: jitter(i, 3) * 5 },
          key: { x: jitter(i, 7) * 20, y: jitter(i, 8) * 12, rotation: jitter(i, 9) * 8, transformOrigin: "0% 50%" },
          receipt: { x: jitter(i, 10) * 16, y: jitter(i, 11) * 14, rotation: jitter(i, 12) * 10 },
        };
        return { cell, tile, chips: [[url, end.url], [key, end.key], [receipt, end.receipt]], end, inner: i === 5 || i === 6 };
      });

      // Ring slot (degrees) per grid cell, picked so every tile moves outward and stays in its own
      // half: no path crosses the hub, and the two centre tiles leave only after their row
      // neighbours have cleared the way (sampled from Frame 1's end grid: boxes stay >=33px apart).
      const SLOT_DEG = [-135, -105, -75, -45, -165, 165, 15, -15, 135, 105, 75, 45];
      tiles.forEach((t, i) => {
        const a = (SLOT_DEG[i] * Math.PI) / 180;
        t.sx = C.x + Math.cos(a) * RX;
        t.sy = C.y + Math.sin(a) * RY;
        t.slot = (SLOT_DEG[i] + 180 - 15) / 30;
      });
      const order = [...tiles].sort((a, b) => a.slot - b.slot);

      // Scene 1 — "AnyRouter puts all of them behind one door"
      tl.fromTo(byId("eyebrow"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 0.04);
      tiles.flatMap((t) => t.chips).forEach(([el, from], i) => {
        tl.fromTo(
          el,
          { ...from, opacity: 1 },
          { y: from.y + 150 + (i % 3) * 30, rotation: from.rotation + ((i * 7) % 5 - 2) * 7, opacity: 0, duration: 0.35, ease: "power2.in" },
          0.04 + i * 0.006,
        );
      });

      // The cell carries the tile to its slot while the tile sheds Frame 1's jostle on the same curve.
      order.forEach((t) => {
        const at = t.inner ? 0.65 : 0.45;
        tl.fromTo(
          t.cell,
          t.end.cell,
          { x: t.sx - 960 - RING_SCALE * TILE_CX, y: t.sy - 540 - RING_SCALE * TILE_CY, scale: RING_SCALE, duration: 1.1, ease: "power2.inOut" },
          at,
        );
        tl.fromTo(t.tile, t.end.tile, { x: 0, y: 0, rotation: 0, duration: 1.1, ease: "power2.inOut" }, at);
      });

      tl.fromTo(byId("hub"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 1.5);

      const markPaths = byId("mark").querySelectorAll("path");
      markPaths.forEach((p, i) => {
        const len = p.getTotalLength() || 30000;
        p.style.strokeDasharray = `${len}`;
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" }, 1.56 + i * 0.1);
      });
      tl.fromTo(markPaths, { fillOpacity: 0, stroke: "#0A0A0A" }, { fillOpacity: 1, stroke: "#BB4D00", duration: 0.45, ease: "power2.out" }, 2.42);

      order.forEach((t) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", C.x);
        line.setAttribute("y1", C.y);
        line.setAttribute("x2", t.sx);
        line.setAttribute("y2", t.sy);
        const len = Math.hypot(t.sx - C.x, t.sy - C.y);
        // Gap and offset run past the line so the round cap leaves no dot before the draw.
        line.style.strokeDasharray = `${len} ${len + 4}`;
        spokes.appendChild(line);
        tl.fromTo(line, { strokeDashoffset: len + 2 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.42 + t.slot * 0.03);
      });

      // Scene 2 — "One account. One key." Each chip lands on the noun, then settles without overshoot.
      const stamp = (el, landAt) => {
        tl.fromTo(el, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1.03, duration: 0.15, ease: "power1.in" }, landAt - 0.15);
        tl.to(el, { scale: 1, duration: 0.5, ease: "power3.out" }, landAt);
      };
      stamp(byId("account"), 2.77);
      stamp(byId("key"), 3.98);

      // Scene 3 — "more than 260 models"
      tl.fromTo(byId("count"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.84);
      tl.fromTo(byId("label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.0);

      const num = byId("num");
      const state = { value: 0 };
      tl.fromTo(
        state,
        { value: 0 },
        { value: 260, duration: 1.21, ease: "power3.out", onUpdate: () => (num.textContent = String(Math.round(state.value))) },
        4.95,
      );
      tl.fromTo(num, { scale: 0.5 }, { scale: 1, duration: 1.21, ease: "power3.out" }, 4.95);
      tl.fromTo(byId("plus"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.16);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
