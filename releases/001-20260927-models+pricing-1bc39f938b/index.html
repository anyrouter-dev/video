<!doctype html>
<html lang="en"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>AnyRouter — model drop</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#0A0A0A;perspective:2200px}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;
    transform-style:preserve-3d;will-change:transform}
  .clip{position:absolute;inset:0}
  .field{position:absolute;inset:-10%;background:
    radial-gradient(58% 48% at 20% 16%,rgba(232,125,69,.15),transparent 62%),
    radial-gradient(52% 44% at 84% 80%,rgba(86,64,210,.17),transparent 64%),#0A0A0A}
  .mesh{position:absolute;inset:0;opacity:.26;background-image:
    linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:80px 80px;
    -webkit-mask-image:radial-gradient(68% 58% at 50% 50%,#000 18%,transparent 78%)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080"
     data-duration="20" data-fps="30">
  <div class="field" data-layout-allow-overflow></div>
  <div class="mesh"></div>
  <div id="clip-s00-ignite" class="clip" data-composition-id="s00-ignite" data-composition-src="compositions/s00-ignite.html"
       data-start="0" data-duration="1.88"></div>
  <div id="clip-s01-xiaomi-mimo-v2-6-flash" class="clip" data-composition-id="s01-xiaomi-mimo-v2-6-flash" data-composition-src="compositions/s01-xiaomi-mimo-v2-6-flash.html"
       data-start="1.88" data-duration="3.184"></div>
  <div id="clip-s02-xiaomi-mimo-v2-6-pro" class="clip" data-composition-id="s02-xiaomi-mimo-v2-6-pro" data-composition-src="compositions/s02-xiaomi-mimo-v2-6-pro.html"
       data-start="5.064" data-duration="3.184"></div>
  <div id="clip-s03-mistralai-mistral-small-3-2-24b-instruct" class="clip" data-composition-id="s03-mistralai-mistral-small-3-2-24b-instruct" data-composition-src="compositions/s03-mistralai-mistral-small-3-2-24b-instruct.html"
       data-start="8.248" data-duration="3.184"></div>
  <div id="clip-s04-baai-bge-multilingual-gemma2" class="clip" data-composition-id="s04-baai-bge-multilingual-gemma2" data-composition-src="compositions/s04-baai-bge-multilingual-gemma2.html"
       data-start="11.432" data-duration="3.184"></div>
  <div id="clip-s05-baai-bge-m3" class="clip" data-composition-id="s05-baai-bge-m3" data-composition-src="compositions/s05-baai-bge-m3.html"
       data-start="14.616" data-duration="3.184"></div>
  <div id="clip-s99-cta" class="clip" data-composition-id="s99-cta" data-composition-src="compositions/s99-cta.html"
       data-start="17.8" data-duration="2.2"></div>
  <audio id="music" data-start="0" data-duration="20" data-track-index="9"
         src="audio/score.wav" data-volume="1"></audio>
</div>
<script>
  // The camera lives on #root: a continuous slow push plus a punch on every
  // scene, and a slow 3D orbit so the frame is never fully static.
  const tl = gsap.timeline({ paused: true });
  tl.set("#root", { scale: 1.17, rotateY: -6.5, rotateX: 2.2 }, 0);
  tl.to("#root", { scale: 1.05, duration: 11.00, ease: "sine.inOut", overwrite: false }, 0);
  tl.to("#root", { rotateY: 3.4, rotateX: -1.6, duration: 10.00, ease: "sine.inOut", overwrite: false }, 0);
  tl.to("#root", { rotateY: -3.4, rotateX: 1.6, duration: 10.00, ease: "sine.inOut", overwrite: false }, 10.00);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},0);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},1.88);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},5.064);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},8.248);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},11.432);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},14.616);
  tl.fromTo("#root",{scale:1.052},{scale:1,duration:.5,ease:"expo.out",overwrite:"auto"},17.8);
  window.__timelines["main"] = tl;
</script>
</body></html>
